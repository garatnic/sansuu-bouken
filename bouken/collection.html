<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>博物館｜算数ぼうけん</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f1;color:#233e30;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:16px}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;background:#28744f;color:white;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #dba339;outline-offset:2px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:25px;margin:8px 0}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0}.muted{color:#718271;font-size:12px}.panel{padding:17px;background:white;border:1px solid #dfe7da;border-radius:16px;margin:15px 0}.number{font-size:30px;font-weight:800}.bar{height:8px;background:#e8eee3;border-radius:8px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:#62a176}.tabs{display:flex;gap:7px;margin:14px 0}.tabs button{flex:1;background:#e5ede1;color:#526b52}.tabs .on{background:#28744f;color:white}.toolbar{display:flex;gap:7px;margin:15px 0}input{flex:1;min-width:0;padding:11px;border:1px solid #cdd9c7;border-radius:10px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{padding:8px 10px;background:white;color:#647961;border:1px solid #d6e1d0;font-size:12px}.filters .on{background:#28744f;color:white;border-color:#28744f}.group-title{background:#285b40;color:white;border-radius:10px;padding:12px 14px;margin:23px 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}.complete{color:#a35913;font-size:12px;font-weight:bold}.group-title .complete{color:#ffe19d}.sub{border:1px solid #cbd8c5;border-radius:16px;padding:13px;background:white;margin:11px 0;scroll-margin-top:16px}.reward{font-size:12px;line-height:1.6;background:#f0f5ec;border-radius:7px;padding:8px 10px;margin-top:10px;color:#506e4f}.reward.done{background:#fff3d9;color:#956021}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:10px}.item{position:relative;min-width:0;color:#294432;background:transparent;border:1px solid transparent;padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:5px}.item:hover{background:#f1f6ec}.item.hit{background:#fff1b7;border-color:#e1b544}.item b{font-size:11px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}.no{position:absolute;left:2px;top:1px;font-size:9px;color:#82917b;background:#ffffffb0;border-radius:3px;padding:1px}.sprite{display:block;object-fit:contain;width:64px;height:64px;image-rendering:pixelated;flex-shrink:0}.locked .sprite{filter:brightness(0) invert(.62)}.locked b{color:#7d8978}.item em{font-style:normal;font-size:10px;color:#83947c}.bonus-card p{font-size:13px;line-height:1.8;color:#698061}.value{font-size:24px;font-weight:800;color:#28744f;white-space:nowrap}.light{background:#e5ede1;color:#345b40}dialog{border:0;border-radius:16px;padding:0;width:min(94vw,520px);max-height:86dvh;overflow:auto;color:#233e30;box-shadow:0 16px 60px #122e3340}dialog::backdrop{background:#10251f88}.dialog-head{position:sticky;top:0;z-index:2;background:white;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 17px;border-bottom:1px solid #e5ecdf}.content{padding:17px}.jump{display:block;width:100%;text-align:left;margin:8px 0;background:#f1f6ed;color:#345b40}.jump .bar{height:6px}.empty{padding:50px 15px;text-align:center;color:#718271}.hero{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}.hero .sprite{zoom:2}.note{font-size:11px;line-height:1.7;color:#718271}.sample{background:#e8efe1;padding:12px;border-radius:12px;margin:18px 0;font-size:12px;line-height:1.7}select{border:1px solid #bdcdb4;background:white;color:#35543b;padding:6px;border-radius:7px;max-width:100%}[hidden]{display:none!important}@media(max-width:500px){main{padding:12px}.sub{padding:10px 8px}.grid{gap:1px}.item b{font-size:10px}.sprite{width:56px;height:56px;background-size:1137.5px 1365px}.hero .sprite{zoom:2}.toolbar button{padding:10px}.group-title{font-size:16px}.number{font-size:27px}.value{font-size:22px}}
</style><main><header><h1>博物館</h1><button id="home">ホームに戻る</button></header><div class="tabs"><button class="on" data-tab="list">コレクション一覧</button><button data-tab="bonus">コレクションボーナス</button></div><section class="panel" id="summary"></section><section id="list"><div class="toolbar"><input id="search" placeholder="名前・番号でさがす" aria-label="コレクションの名前・番号"><button id="comp">コンプ</button></div><div class="filters"><button class="on" data-filter="all">すべて</button><button data-filter="yes">コンプリートした</button><button data-filter="no">コンプリートしてない</button></div><div id="groups"></div></section><section id="bonus" hidden></section></main><dialog id="dialog"><div class="dialog-head"><h2 id="title"></h2><button id="close">閉じる</button></div><div class="content" id="body"></div></dialog><script src="common/schema.js?v=59"></script><script src="common/save.js?v=59"></script><script src="common/master.js?v=59"></script><script src="common/collection.js?v=59"></script><script src="common/item-images.js?v=59"></script><script>
(async()=>{try{
const [groups,subgroups,itemMaster,rewards,reward_types]=await Promise.all(['collection_groups','collection_subgroups','collection_items','collection_rewards','collection_reward_types'].map(n=>BoukenMaster.load(n)));const D={groups,subgroups,items:itemMaster,rewards,reward_types};const save=BoukenSave.load();BoukenCollection.configure(itemMaster,rewards);await BoukenItemImages.init();let filter='all',tab='list';const $=s=>document.querySelector(s),own=id=>Number(save.items?.[id]||0)>0,items=s=>D.items.filter(i=>i.subgroupId===s),count=s=>items(s).filter(i=>own(i.id)).length,done=s=>count(s)===5;const names=D.reward_types.map(r=>r.name),reward=s=>D.rewards.find(r=>r.subgroupId===s),levels=()=>names.map((_,i)=>D.subgroups.filter(s=>done(s.id)&&reward(s.id).rewardId===i+1).length),bar=(n,total)=>`<div class="bar" role="progressbar" aria-label="収集進捗" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${total}"><i style="width:${100*n/total}%"></i></div>`,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sprite(id){return `<span class="sprite" data-picture="${id}" aria-hidden="true"></span>`}
function pictures(root){root.querySelectorAll('[data-picture]').forEach(el=>{const image=BoukenItemImages.picture(el.dataset.picture);image.style.width='100%';image.style.height='100%';el.replaceChildren(image);});}
function open(title,body){$('#title').textContent=title;$('#body').innerHTML=body;pictures($('#body'));$('#dialog').showModal()}
function render(){const total=D.items.filter(i=>own(i.id)).length,complete=D.subgroups.filter(s=>done(s.id)).length;$('#summary').innerHTML=`<div class="row"><div><span class="muted">コレクションの登録</span><div><span class="number">${total}</span><span class="muted"> / 480 品</span></div></div><div class="muted">小分類コンプ<br><b>${complete} / 96</b></div></div>${bar(total,480)}`;
const q=$('#search').value.trim().toLowerCase();$('#groups').innerHTML=D.groups.map(g=>{const subs=D.subgroups.filter(s=>s.groupId===g.id&&(filter==='all'||done(s.id)===(filter==='yes'))&&(!q||items(s.id).some(i=>i.name.toLowerCase().includes(q)||String(i.id).includes(q))));if(!subs.length)return '';return `<div class="group-title"><h2>${g.id}. ${esc(g.name)}</h2>${D.subgroups.filter(s=>s.groupId===g.id).every(s=>done(s.id))?'<span class="complete">🎉 コンプ！</span>':''}</div>`+subs.map(s=>{const r=reward(s.id),n=count(s.id);return `<article class="sub" id="sub-${s.id}"><div class="row"><h3>${esc(s.name)}</h3><span>${n===5?'<span class="complete">🎉 コンプ！</span>':'<span class="muted">'+n+' / 5</span>'}</span></div>${bar(n,5)}<div class="grid">${items(s.id).map(i=>`<button class="item ${own(i.id)?'':'locked'} ${q&&(i.name.toLowerCase().includes(q)||String(i.id).includes(q))?'hit':''}" data-id="${i.id}" aria-label="${esc(i.name)} ${own(i.id)?'獲得済み':'未獲得'}">${sprite(i.id)}<span class="no">${String(i.id).padStart(3,'0')}</span><b>${esc(i.name)}</b><em>${own(i.id)?'獲得済み':'未獲得'}</em></button>`).join('')}</div><div class="reward ${n===5?'done':''}">${n===5?'✓ 発動中':'5品コンプで'}：${names[r.rewardId-1]} ${r.amountText}</div></article>`}).join('')}).join('')||'<div class="empty">該当する小分類がありません。</div>';
const descriptions=['正解したとき、仲間のスキルとは別に追加で1マス開拓するチャンス。','新しいワールドの出発時に、自動で開拓するマスが増えます。','施設で仲間をさそうときの成功率が上がります。','仲間を見つけるとき、まだ仲間になっていない仲間が選ばれやすくなります。','施設でコレクションを手に入れる成功率が上がります。','コレクションを見つけるとき、まだ手に入れていないコレクションが選ばれやすくなります。'];$('#bonus').innerHTML='<div class="note">小分類をコンプリートすると自動で発動。次のワールドへも引き継ぐ、仲間のスキルとは別のボーナスです。</div>'+levels().map((n,i)=>`<article class="panel bonus-card"><div class="row"><h3>${names[i]}</h3><span class="value">+${i===1?n:(n*.2).toFixed(1)}${i===1?'マス':'ポイント'}</span></div>${bar(n,16)}<div class="row muted" style="margin-top:7px"><span>${n} / 16 段階</span><span>最大 +${i===1?'16マス':'3.2ポイント'}</span></div><p>${descriptions[i]}</p><button class="light" data-reward="${i+1}">対象のコレクションを見る</button></article>`).join('')+'<p class="note">ポイント＝パーセントポイント。1段階につき、初期自動開拓は＋1マス、ほかの効果は＋0.2ポイントです。</p>';
pictures($('#groups'));
}
function progress(rewardId){const groups=D.groups.map(g=>{const subs=D.subgroups.filter(s=>s.groupId===g.id&&(!rewardId||reward(s.id).rewardId===rewardId));return subs.length?`<h3 style="margin:18px 0 7px">${g.name}</h3>`+subs.map(s=>`<button class="jump" data-jump="${s.id}"><span class="row"><b>${s.name}</b><span>${count(s.id)} / 5 ${done(s.id)?'🎉 コンプ！':''}</span></span>${bar(count(s.id),5)}<span class="note">${names[reward(s.id).rewardId-1]} ${reward(s.id).amountText}</span></button>`).join(''):''}).join('');open(rewardId?names[rewardId-1]+'のコレクション':'コンプリート状況',groups)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;$('#list').hidden=tab!=='list';$('#bonus').hidden=tab!=='bonus';document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b))}if(b.dataset.filter){filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));render()}if(b.dataset.id){const i=D.items.find(i=>i.id===+b.dataset.id);open(i.name,`<div class="hero ${own(i.id)?'':'locked'}">${sprite(i.id)}<b>No.${String(i.id).padStart(3,'0')} ${esc(i.name)}</b><span class="muted">${D.groups.find(g=>g.id===i.groupId).name} / ${D.subgroups.find(s=>s.id===i.subgroupId).name}</span><p>${own(i.id)?'✨ 博物館に登録されています。<br>これまでに '+Number(save.items?.[i.id]||0)+' 個獲得！':'まだ手に入れていないコレクションだよ。<br>ぼうけんに出て、さがしてみよう！'}</p></div>`)}if(b.dataset.reward)progress(+b.dataset.reward);if(b.dataset.jump){$('#dialog').close();$('#search').value='';filter='all';document.querySelector('[data-filter="all"]').click();document.querySelector('[data-tab="list"]').click();document.getElementById('sub-'+b.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'})}});
$('#comp').onclick=()=>progress();$('#close').onclick=()=>$('#dialog').close();$('#home').onclick=()=>{location.href='home.html'};$('#search').oninput=render;matchMedia('(max-width:500px)').addEventListener('change',render);render();}catch(e){document.getElementById('summary').textContent=e.message;}})();
</script></html>
