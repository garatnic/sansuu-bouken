<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>パーティー編成 | 算数ぼうけん</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f5f8f4;color:#1e3327;margin:0 auto;padding:14px;max-width:650px}h1{font-size:1.4rem;margin:20px 0 12px}.button,button{border:0;border-radius:11px;background:#25704d;color:white;padding:12px;cursor:pointer;font:inherit}a.button{display:block;text-align:center;text-decoration:none}.panel{background:white;border-radius:14px;padding:14px;margin:15px 0}.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.slot{border:2px solid #d9dfd9;border-radius:8px;background:#f6f8f5;color:#1e3327;min-height:72px;padding:4px 2px;font-size:11px;overflow:hidden}.slot.active{border-color:#e3a725;background:#fff5d9}.slot:disabled{background:#ebeeeb;color:#748176}.slot img,.char img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}.slot img{width:42px;height:42px}.slot span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:12px;color:#627367}.effects{display:grid;gap:7px}.effect{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;border-bottom:1px solid #edf0ec;padding:5px 0}.filter{display:flex;align-items:center;gap:6px;justify-content:space-between}.filter button{background:#eef2ee;color:#244734;min-width:48px;font-size:22px}.filter strong{text-align:center;flex:1}.search{width:100%;padding:12px;border:1px solid #ccd6cc;border-radius:10px;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.char{border:2px solid #e2e8e1;background:#f7faf6;color:#1e3327;min-width:0;min-height:118px;padding:7px 3px;display:flex;flex-direction:column;align-items:center;gap:3px}.char.picked{border-color:#36976a;background:#e9f7ee}.char b{font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.char small{font-size:11px;color:#5d7164}.pill{font-size:11px;background:#e4eee6;border-radius:8px;padding:2px 5px}.message{color:#9b481e;font-size:13px;min-height:18px}.actions{display:flex;gap:8px}.actions button{font-size:13px}.actions button:disabled{opacity:.4}.hidden{display:none}
</style><style>.skill-effect-list{display:grid;gap:7px}.skill-effect-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin:0;padding:11px 9px;border:1px solid #e0e8df;border-radius:9px;background:#f7faf6;color:#203b29;text-align:left;font:inherit;cursor:pointer}.skill-effect-row:focus-visible{outline:3px solid #e6ad31}.skill-dialog{border:0;border-radius:15px;padding:20px;width:min(92vw,460px);max-height:85vh;overflow:auto;color:#203b29;background:white;box-shadow:0 12px 36px #0004}.skill-dialog::backdrop{background:#0008}.skill-dialog h2{margin:0 0 12px;font-size:1.25rem}.skill-dialog p{white-space:pre-wrap;line-height:1.6}.skill-dialog .close-skill{display:block;margin:16px 0 0 auto;width:auto;padding:10px 22px;background:#25704d;color:white;border:0;border-radius:9px;font:inherit;cursor:pointer}</style><style>.page-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}.page-heading h1{margin:0;min-width:0}.page-back{display:inline-block;flex:none;width:auto!important;margin:0!important;padding:9px 11px!important;font-size:.82rem!important;border-radius:9px!important;background:#25704d;color:#fff;text-decoration:none;white-space:nowrap}</style><style>.roster{display:grid;gap:9px;margin-top:10px}.char-line{display:grid;grid-template-columns:38px minmax(0,1fr) 42px;gap:8px;align-items:center;border:2px solid #e2e8e1;border-radius:11px;background:#f7faf6;padding:9px 7px;color:#1e3327;min-width:0}.char-line.picked{border-color:#36976a;background:#e9f7ee}.char-avatar{text-align:center;font-size:25px}.char-info{min-width:0}.char-heading{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:5px}.char-heading small{font-weight:400;color:#627367;margin-right:5px}.char-skill{display:flex;gap:6px;align-items:baseline;font-size:11px;min-width:0;margin:3px 0}.char-skill .skill-tag{flex:none;font-weight:700;min-width:90px;border-radius:5px;padding:2px 4px;background:#f7dce2;color:#612c38}.char-skill.b .skill-tag{background:#dcecff;color:#23496e}.char-skill.c .skill-tag{background:#dcf1de;color:#275c35}.char-skill.d .skill-tag{background:#fff0cb;color:#6d4b16}.char-skill .skill-summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#52665b}.pick-button{padding:7px 0;font-size:22px;border-radius:10px}.condition-dialog{border:0;border-radius:15px;width:min(94vw,590px);max-height:88vh;padding:17px;color:#1e3327;box-shadow:0 12px 36px #0004}.condition-dialog::backdrop{background:#0008}.condition-dialog h2{margin:0;font-size:1.2rem}.condition-list{max-height:60vh;overflow:auto;border:1px solid #dfe7df;border-radius:10px;margin:12px 0}.condition-group{padding:9px;background:#eaf1eb;font-weight:700;position:sticky;top:0}.condition-item{display:flex;align-items:flex-start;gap:9px;padding:9px;border-bottom:1px solid #e8eee8;font-size:12px;cursor:pointer}.condition-item input{margin-top:4px;accent-color:#25704d}.condition-text{min-width:0}.condition-text strong{display:block;margin-bottom:3px}.condition-text span{display:block;color:#52665b;line-height:1.45}.condition-actions{display:flex;gap:8px}.condition-actions button{flex:1}.light-button{background:#e7eeea;color:#244734}</style><style>.roster-loader{height:24px;text-align:center;color:#627367;font-size:12px;padding:4px}</style><style>.character-image{width:38px;height:38px;display:inline-block;vertical-align:middle;image-rendering:pixelated;pointer-events:none}.slot .character-image{width:42px;height:42px}</style><link rel="stylesheet" href="common/character-detail.css?v=81"><style>.skill-effect-row.character-highlight{background:#fff5d9;border:2px solid #e3a725}.char-line{grid-template-columns:minmax(0,1fr) 42px}.character-details-button{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;align-items:center;min-width:0;width:100%;padding:0;background:transparent;color:inherit;border-radius:5px;text-align:left}.character-details-button:focus-visible{outline:3px solid #e3a725;outline-offset:3px}.character-details-button .char-avatar,.character-details-button .char-info,.character-details-button .char-heading{display:block}</style><link rel="stylesheet" href="common/screen-ui.css?v=81"><style>.recommendation-dialog{border:0;padding:0;width:min(100vw,650px);max-width:100vw;height:100dvh;max-height:100dvh;margin:auto;background:#f5f8f4;border-radius:12px}.recommendation-dialog::backdrop{background:#0009}.recommendation-dialog iframe{border:0;width:100%;height:100%;display:block}</style><link rel="stylesheet" href="common/party-forecast.css?v=81"></head><body>
<header class="page-heading"><h1>現在のパーティー <span id="partyCount"></span></h1><a class="page-back" href="home.html">ホームに戻る</a></header>
<section class="panel"><p id="pageStatus" class="page-status" role="status">パーティーを読み込んでいます…</p><div class="slots" id="slots"></div><div class="party-actions"><button id="recommendParty" type="button" disabled>じどう🤖</button><button id="remove" disabled type="button">はずす</button><button id="restoreParty" disabled type="button">もとに戻す</button></div></section>
<section id="partyForecast" aria-labelledby="forecastHeading"><h2 id="forecastHeading">30問といたらどうなるかな？</h2><p id="forecastStatus" role="status">予想を準備しています…</p><div id="forecastGraph" hidden></div><p id="forecastNote"></p></section>
<h1>現在の効果</h1><section class="panel"><div id="effects" class="effects"></div></section>
<div class="row"><h1>仲間たち</h1><button id="conditions" disabled type="button">☷ じょうけん</button></div><section class="panel"><input class="search" id="search" disabled placeholder="なまえ・番号でさがす" aria-label="仲間を検索"><p class="small" id="found"></p><p class="small" id="activeConditions"></p><div class="roster" id="list"></div><div class="roster-loader" id="rosterLoader" aria-live="polite"></div></section><dialog id="conditionDialog" class="condition-dialog"><div class="row"><h2>じょうけん（AND条件）</h2><button id="closeConditions" type="button" class="light-button">×</button></div><p class="small">新しい仲間や、チェックしたスキルで絞り込めます。スキルはすべて満たす仲間を表示します。</p><div id="conditionList" class="condition-list"></div><div class="condition-actions"><button id="clearConditions" type="button" class="light-button">すべて解除</button><button id="applyConditions" type="button">この条件で絞り込む</button></div></dialog><p class="message" id="message" role="status"></p>
<script src="common/character-images.js?v=81"></script><script src="common/character-detail.js?v=81"></script><script src="common/skill-ui.js?v=81"></script><script src="common/version.js?v=81"></script><script src="common/schema.js?v=81"></script><script src="common/save.js?v=81"></script><script src="common/master.js?v=81"></script><script src="common/party.js?v=81"></script>
<script src="common/party-recommendation.js?v=81"></script><script src="tests/party-recommendation/integration/radar.js?v=81"></script><script src="common/party-forecast.js?v=81"></script><script>
(async()=>{
const $=id=>document.getElementById(id), msg=s=>$('message').textContent=s;
try{
 const [characters,allSkills]=await Promise.all([BoukenMaster.load('characters'),BoukenMaster.load('skills')]);
 const skills=allSkills.filter(s=>/^[A-Z]\d{2}$/.test(s.id)).sort((a,b)=>a.id.localeCompare(b.id));
 const names=new Map(skills.map(s=>[s.id,s.name]));
 const byId=new Map(characters.map(c=>[c.id,c]));
 let save=BoukenSave.load(), owned=characters.filter(c=>Number(save.characters?.[c.id]||0)>0);
 let max=BoukenParty.capacity(owned.length);
 let party=BoukenParty.normalize(save.party,owned.map(c=>c.id),max);
 let originalParty=[...party];
 const forecast=BoukenPartyForecast.create({graph:$('forecastGraph'),status:$('forecastStatus'),note:$('forecastNote')});
 let slot=-1;const selected=new Set(['recent20']);const descriptions=await fetch('data/skill_messages.json?v=81').then(r=>{if(!r.ok)throw Error('スキル説明を取得できません');return r.json()});const dialog=$('conditionDialog');const conditionList=$('conditionList');const recentLabel=document.createElement('label');recentLabel.className='condition-item';const recentCheck=document.createElement('input');recentCheck.type='checkbox';recentCheck.value='recent20';const recentText=document.createElement('strong');recentText.textContent='あたらしく入った仲間２０人';recentLabel.append(recentCheck,recentText);conditionList.append(recentLabel);for(const prefix of [...new Set(skills.map(s=>s.id[0]))]){const group=document.createElement('div');group.className='condition-group';group.textContent=({A:'A：開拓',B:'B：探索・視界',C:'C：収集',D:'D：仲間・施設',E:'E：地形・ワールド',F:'F：イベント補助'})[prefix]||prefix;conditionList.append(group);for(const skill of skills.filter(x=>x.id.startsWith(prefix))){const label=document.createElement('label');label.className='condition-item';const check=document.createElement('input');check.type='checkbox';check.value=skill.id;const detail=document.createElement('div');detail.className='condition-text';const title=document.createElement('strong');title.textContent=skill.id+' '+skill.name+(skill.id==='D04'?'（準備中）':'');const desc=document.createElement('span');desc.textContent=descriptions[skill.id]||'説明準備中';detail.append(title,desc);label.append(check,detail);conditionList.append(label)}}$('conditions').onclick=()=>{conditionList.querySelectorAll('input').forEach(c=>c.checked=selected.has(c.value));dialog.showModal()};$('closeConditions').onclick=()=>dialog.close();$('clearConditions').onclick=()=>conditionList.querySelectorAll('input').forEach(c=>c.checked=false);$('applyConditions').onclick=()=>{selected.clear();conditionList.querySelectorAll('input:checked').forEach(c=>selected.add(c.value));dialog.close();render()};
 // 古い/不正な編成は表示だけ補正し、ユーザー操作まではセーブを書き換えない。
 // No per-character URL: all slots and roster rows reuse the same decoded sheet.
 if(owned.length){msg('仲間の画像を読み込んでいます…');await BoukenCharacterImages.init();msg('');}
 const pic=c=>BoukenCharacterImages.picture(c.id);
 function persist(next,nextSlot=slot,base=save,updateOriginal=false){const copy=JSON.parse(JSON.stringify(base));copy.party=next;try{save=BoukenSave.save(copy)}catch(e){msg('保存できませんでした：'+e.message);return false}owned=characters.filter(c=>Number(save.characters?.[c.id]||0)>0);max=BoukenParty.capacity(owned.length);party=next;if(updateOriginal)originalParty=[...next];slot=nextSlot;msg('編成を保存しました');render();forecast.update(save,party);return true}
 const PAGE_SIZE=20;let visible=[],shownCount=0;const list=$('list'),loader=$('rosterLoader');
 function appendPage(){if(shownCount>=visible.length){loader.textContent='';return}const end=Math.min(shownCount+PAGE_SIZE,visible.length);for(let i=shownCount;i<end;i++)list.append(makeCard(visible[i]));shownCount=end;loader.textContent=shownCount<visible.length?'下にスクロールすると、つづきが出るよ':'';}
 const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))appendPage()},{rootMargin:'300px'});observer.observe(loader);
 function render(){
 $('partyCount').textContent=`（${party.filter(Boolean).length}/${max}）`;
 const slots=$('slots');slots.replaceChildren();
 for(let i=0;i<5;i++){const b=document.createElement('button');b.className='slot'+(slot===i?' active':'');b.disabled=i>=max;b.type='button';if(i>=max){b.textContent='🔒'}else{const c=byId.get(party[i]);if(c){b.append(pic(c));const t=document.createElement('span');t.textContent=c.name;b.append(t)}else b.textContent='＋';b.onclick=()=>{slot=i;render()}}slots.append(b)}
 $('restoreParty').disabled=party.every((id,i)=>id===originalParty[i]);$('restoreParty').onclick=()=>persist([...originalParty],-1);
 $('remove').disabled=!party[slot];$('remove').onclick=()=>{if(slot<0)return;const next=[...party];next[slot]=null;persist(next)};
 const buffs=BoukenParty.buffs(party,byId);BoukenSkillUI.render($('effects'),buffs,skills,(byId.get(party[slot])?.skills||[]).map(s=>s.id));
 const query=$('search').value.trim().toLowerCase();
 const joinOrder=[...new Set([...(Object.keys(save.characters||{}).filter(id=>Number(save.characters[id])>0).map(Number).sort((a,b)=>a-b)),...(save.characterJoinOrder||[])])];const known=new Set((save.characterJoinOrder||[]).map(Number));const ordered=[...joinOrder.filter(id=>!known.has(id)),...(save.characterJoinOrder||[])];const recent=ordered.slice().reverse().map(id=>byId.get(Number(id))).filter(c=>c&&Number(save.characters?.[c.id])>0).slice(0,20);
 const shown=(selected.has('recent20')?recent:owned).filter(c=>[...selected].filter(id=>id!=='recent20').every(id=>c.skills?.some(s=>s.id===id))&&(!query||c.name.toLowerCase().includes(query)||String(c.id).includes(query)));
 $('found').textContent=`${shown.length}体 / 所持${owned.length}体`;
 $('activeConditions').textContent=selected.size?'選択中：'+[...selected].sort().map(id=>id==='recent20'?'あたらしく入った仲間２０人':id).join(' ＋ ')+'（AND）':'条件なし：すべての仲間';
 visible=shown;shownCount=0;list.replaceChildren();
 if(!shown.length)list.textContent='該当する仲間はいません';
 appendPage();
 }
 function makeCard(c){const card=document.createElement('div');card.className='char-line'+(party.includes(c.id)?' picked':'');const avatar=document.createElement('span');avatar.className='char-avatar';avatar.append(pic(c));const info=document.createElement('span');info.className='char-info';const heading=document.createElement('span');heading.className='char-heading';const number=document.createElement('small');number.textContent='No.'+c.id;heading.append(number,document.createTextNode(c.name));info.append(heading);for(const sk of c.skills||[]){const def=names.get(sk.id)||sk.id;const line=document.createElement('span');line.className='char-skill '+sk.id[0].toLowerCase();const tag=document.createElement('span');tag.className='skill-tag';tag.textContent=sk.id+' '+def+' Lv'+sk.level;const summary=document.createElement('span');summary.className='skill-summary';summary.textContent=descriptions[sk.id]||'説明準備中';summary.title=descriptions[sk.id]||'';line.append(tag,summary);info.append(line)}const pick=document.createElement('button');pick.type='button';pick.className='pick-button';pick.textContent=party.includes(c.id)?'✓':'＋';pick.setAttribute('aria-label',c.name+'を編成');pick.onclick=()=>{if(party.includes(c.id)){slot=party.indexOf(c.id);render();return}const empty=party.findIndex(id=>!id),target=empty>=0?empty:slot;if(target<0){msg('入れかえる枠をタップしてね');return}const next=[...party];next[target]=c.id;persist(next,Math.min(max-1,target+1))};const details=document.createElement('button');details.type='button';details.className='character-details-button';details.setAttribute('aria-label',c.name+'の詳細');const openDetails=()=>BoukenCharacterDetail.show(c,{skills,descriptions});details.onclick=openDetails;details.append(avatar,info);card.onclick=e=>{if(e.target===card)openDetails()};card.append(details,pick);return card}
 $('recommendParty').disabled=false;$('recommendParty').onclick=()=>{try{BoukenRecommendation.open({characters,persist:(next,nextSlot,latest)=>persist(next,nextSlot,latest,true),onClose:()=>$('recommendParty').focus()});}catch(e){msg('読み込みに失敗しました：'+e.message);}};
 $('search').oninput=render;render();forecast.update(save,party);$('pageStatus').textContent='';$('conditions').disabled=false;$('search').disabled=false;
}catch(e){$('pageStatus').textContent='';msg('読み込みに失敗しました: '+e.message);console.error(e)}
})();
</script></body></html>
