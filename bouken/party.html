<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>パーティー編成 | 算数ぼうけん</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f5f8f4;color:#1e3327;margin:0 auto;padding:14px;max-width:650px}h1{font-size:1.4rem;margin:20px 0 12px}.button,button{border:0;border-radius:11px;background:#25704d;color:white;padding:12px;cursor:pointer;font:inherit}a.button{display:block;text-align:center;text-decoration:none}.panel{background:white;border-radius:14px;padding:14px;margin:15px 0}.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.slot{border:2px solid #d9dfd9;border-radius:8px;background:#f6f8f5;color:#1e3327;min-height:72px;padding:4px 2px;font-size:11px;overflow:hidden}.slot.active{border-color:#e3a725;background:#fff5d9}.slot:disabled{background:#ebeeeb;color:#748176}.slot img,.char img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}.slot img{width:42px;height:42px}.slot span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:12px;color:#627367}.effects{display:grid;gap:7px}.effect{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;border-bottom:1px solid #edf0ec;padding:5px 0}.filter{display:flex;align-items:center;gap:6px;justify-content:space-between}.filter button{background:#eef2ee;color:#244734;min-width:48px;font-size:22px}.filter strong{text-align:center;flex:1}.search{width:100%;padding:12px;border:1px solid #ccd6cc;border-radius:10px;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.char{border:2px solid #e2e8e1;background:#f7faf6;color:#1e3327;min-width:0;min-height:118px;padding:7px 3px;display:flex;flex-direction:column;align-items:center;gap:3px}.char.picked{border-color:#36976a;background:#e9f7ee}.char b{font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.char small{font-size:11px;color:#5d7164}.pill{font-size:11px;background:#e4eee6;border-radius:8px;padding:2px 5px}.message{color:#9b481e;font-size:13px;min-height:18px}.actions{display:flex;gap:8px}.actions button{font-size:13px}.actions button:disabled{opacity:.4}.hidden{display:none}
</style><style>.skill-effect-list{display:grid;gap:7px}.skill-effect-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin:0;padding:11px 9px;border:1px solid #e0e8df;border-radius:9px;background:#f7faf6;color:#203b29;text-align:left;font:inherit;cursor:pointer}.skill-effect-row:focus-visible{outline:3px solid #e6ad31}.skill-dialog{border:0;border-radius:15px;padding:20px;width:min(92vw,460px);max-height:85vh;overflow:auto;color:#203b29;background:white;box-shadow:0 12px 36px #0004}.skill-dialog::backdrop{background:#0008}.skill-dialog h2{margin:0 0 12px;font-size:1.25rem}.skill-dialog p{white-space:pre-wrap;line-height:1.6}.skill-dialog .close-skill{display:block;margin:16px 0 0 auto;width:auto;padding:10px 22px;background:#25704d;color:white;border:0;border-radius:9px;font:inherit;cursor:pointer}</style><style>.page-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}.page-heading h1{margin:0;min-width:0}.page-back{display:inline-block;flex:none;width:auto!important;margin:0!important;padding:9px 11px!important;font-size:.82rem!important;border-radius:9px!important;background:#25704d;color:#fff;text-decoration:none;white-space:nowrap}</style></head><body>
<header class="page-heading"><h1>現在のパーティー <span id="partyCount"></span></h1><a class="page-back" href="home.html">ホームに戻る</a></header>
<section class="panel"><div class="slots" id="slots"></div><div class="row" style="margin-top:10px"><span class="small" id="slotHint"></span><button id="remove" type="button">選択枠から外す</button></div></section>
<h1>現在の効果</h1><section class="panel"><div id="effects" class="effects"></div></section>
<h1>仲間たち</h1><section class="panel"><div class="filter"><button id="prev" aria-label="前のスキル">◀</button><strong id="skillName">すべて</strong><button id="next" aria-label="次のスキル">▶</button></div><p class="small" id="found"></p><input class="search" id="search" placeholder="なまえ・番号でさがす" aria-label="仲間を検索"><div class="grid" id="list"></div></section><p class="message" id="message" role="status"></p>
<script src="common/skill-ui.js?v=32"></script><script src="common/version.js?v=32"></script><script src="common/schema.js?v=32"></script><script src="common/save.js?v=32"></script><script src="common/master.js?v=32"></script><script src="common/party.js?v=32"></script>
<script>
(async()=>{
const $=id=>document.getElementById(id), msg=s=>$('message').textContent=s;
try{
 const [characters,allSkills]=await Promise.all([BoukenMaster.load('characters'),BoukenMaster.load('skills')]);
 const skills=allSkills.filter(s=>/^[A-Z]\d{2}$/.test(s.id));
 const names=new Map(skills.map(s=>[s.id,s.name]));
 const byId=new Map(characters.map(c=>[c.id,c]));
 let save=BoukenSave.load(), owned=characters.filter(c=>Number(save.characters?.[c.id]||0)>0);
 let max=BoukenParty.capacity(owned.length);
 let party=BoukenParty.normalize(save.party,owned.map(c=>c.id),max);
 let slot=0,skillIndex=0;
 // 古い/不正な編成は表示だけ補正し、ユーザー操作まではセーブを書き換えない。
 // キャラクタースプライト導入まで画像リクエストを完全停止する。
 const pic=()=>{const placeholder=document.createElement('span');placeholder.textContent='👤';placeholder.setAttribute('aria-hidden','true');return placeholder};
 function persist(next){const copy=JSON.parse(JSON.stringify(save));copy.party=next;save=BoukenSave.save(copy);party=next;msg('編成を保存しました');render()}
 function render(){
 $('partyCount').textContent=`（${party.filter(Boolean).length}/${max}）`;
 const slots=$('slots');slots.replaceChildren();
 for(let i=0;i<5;i++){const b=document.createElement('button');b.className='slot'+(slot===i?' active':'');b.disabled=i>=max;b.type='button';if(i>=max){b.textContent='🔒'}else{const c=byId.get(party[i]);if(c){b.append(pic(c));const t=document.createElement('span');t.textContent=c.name;b.append(t)}else b.textContent='＋';b.onclick=()=>{slot=i;render()}}slots.append(b)}
 $('slotHint').textContent=`${slot+1}番の枠を選択中`;
 $('remove').disabled=!party[slot];$('remove').onclick=()=>{const next=[...party];next[slot]=null;persist(next)};
 const buffs=BoukenParty.buffs(party,byId);BoukenSkillUI.render($('effects'),buffs,skills);
 const skill=skillIndex?skills[skillIndex-1]:null;
 $('skillName').textContent=skill?skill.id+' '+skill.name:'すべて';
 const query=$('search').value.trim().toLowerCase();
 const shown=owned.filter(c=>(!skill||c.skills?.some(s=>s.id===skill.id))&&(!query||c.name.toLowerCase().includes(query)||String(c.id).includes(query)));
 $('found').textContent=`${shown.length}体 / 所持${owned.length}体`;
 const list=$('list');list.replaceChildren();
 if(!shown.length)list.textContent='該当する仲間はいません';
 for(const c of shown){const b=document.createElement('button');b.type='button';b.className='char'+(party.includes(c.id)?' picked':'');b.append(pic(c));const n=document.createElement('b');n.textContent=c.name;const id=document.createElement('small');id.textContent='No.'+c.id;b.append(n,id);const pill=document.createElement('span');pill.className='pill';pill.textContent=skill?'Lv'+(c.skills.find(s=>s.id===skill.id)?.level||'?'):(party.includes(c.id)?'編成中':'選択する');b.append(pill);b.onclick=()=>{if(party.includes(c.id)){slot=party.indexOf(c.id);render();return}const next=[...party];next[slot]=c.id;persist(next);slot=Math.min(max-1,slot+1)};list.append(b)}
 }
 $('prev').onclick=()=>{skillIndex=(skillIndex-1+skills.length+1)%(skills.length+1);render()};
 $('next').onclick=()=>{skillIndex=(skillIndex+1)%(skills.length+1);render()};
 $('search').oninput=render;render();
}catch(e){msg('読み込みに失敗しました: '+e.message);console.error(e)}
})();
</script></body></html>
