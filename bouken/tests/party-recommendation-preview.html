<!doctype html><html lang="ja"><meta charset="utf-8"><title>おすすめパーティー本体接続の確認</title><style>body{font:14px system-ui;background:#edf3e9}button,select{padding:10px;margin:4px}iframe{display:block;width:390px;height:850px;border:1px solid #789;margin:10px auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>本体接続の確認（仮セーブ）</h1><p>実画面と実保存APIをメモリ保存領域で動かします。通常セーブは読み書きしません。</p><label>所有種類数<select id="count"><option>0</option><option>1</option><option>29</option><option>30</option><option>47</option><option>99</option><option>100</option><option>140</option><option>170</option><option>200</option><option>230</option><option>260</option><option>279</option><option selected>500</option><option>927</option></select></label><label>幅<select id="width"><option>320</option><option selected>390</option><option>412</option></select></label><button id="seed">仮セーブを作り直す</button><button id="reload">編成画面を再読込</button><button id="depart">出発画面</button><button id="world">保存した冒険</button><label><input id="fail" type="checkbox">保存失敗</label><pre id="state"></pre><iframe id="game" title="ゲーム本体・仮セーブ"></iframe><script src="../common/schema.js?v=71"></script><script>
(()=>{
 const base=new URL('../',location.href).href,frame=document.getElementById('game'),memory={};let writes=0,original='',screen='party.html';
 window.PartyQA={memory,get fail(){return document.getElementById('fail').checked;},wrote(){writes++;},navigate:show};
 async function show(page){screen=page;let html=await fetch(base+page,{cache:'no-store'}).then(r=>r.text());html=html.replace('<meta charset="utf-8">','<meta charset="utf-8"><base href="'+base+'"><script src="tests/party-recommendation-fixture.js"><\/script>');html=html.replaceAll("location.href='world.html'","parent.PartyQA.navigate('world.html')").replaceAll("location.href='home.html'","parent.PartyQA.navigate('home.html')");frame.srcdoc=html;}
 function seed(){const s=BoukenSchema.makeInitialSave(),n=Number(document.getElementById('count').value);s.worldsStarted=3;s.tutorialStory.complete=true;s.characters=Object.fromEntries(Array.from({length:n},(_,i)=>[i+1,1]));s.party=n?[1]:[];s.items=Object.fromEntries(Array.from({length:n===927?480:240},(_,i)=>[i+1,1]));memory[BoukenSchema.key]=JSON.stringify(s);original=memory[BoukenSchema.key];writes=0;show('party.html');}
 document.getElementById('seed').onclick=seed;document.getElementById('reload').onclick=()=>show('party.html');document.getElementById('depart').onclick=()=>show('worldcreate.html');document.getElementById('world').onclick=()=>show('world.html');document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';
 setInterval(()=>{const s=JSON.parse(memory[BoukenSchema.key]||'{}'),before=JSON.parse(original||'{}'),unrelated=x=>{x=structuredClone(x);delete x.party;delete x.updatedAt;return x;};document.getElementById('state').textContent=JSON.stringify({screen,writes,party:s.party,worldParty:s.world?.partySnapshot,worldBuffs:s.world?.partyBuffsSnapshot,unchangedExceptParty:JSON.stringify(unrelated(s))===JSON.stringify(unrelated(before)),world:s.world?{width:s.world.width,explored:s.world.explored.filter(Boolean).length}:null},null,2);},250);seed();
})();
</script></html>
