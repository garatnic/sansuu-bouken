<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロボ状態画面 Phase 4 確認</title><style>body{font:15px system-ui;background:#edf3e9;color:#24402e;margin:16px}main{max-width:900px;margin:auto}button,select{font:inherit;padding:10px;margin:4px;border:1px solid #9db897;border-radius:9px}button{background:#25704d;color:white}iframe{display:block;width:390px;max-width:100%;height:740px;margin:14px auto;border:1px solid #abc;border-radius:12px;background:white}pre{max-height:110px;overflow:auto;white-space:pre-wrap}</style><main><h1>ロボ状態画面 Phase 4 確認</h1><p>通常セーブに触れない仮データです。ホームの「ロボットのじょうたい」から確認してください。各画面のリンクは無効にしています。</p><button id="hidden">未発見</button><button id="boot">起動直後</button><button id="search">20×20探索中</button><button id="found">部品未取付・仲間枠優先</button><button id="all">全強化済み</button><button id="reload">仮データを再読込</button><label>幅<select id="width"><option>390</option><option>320</option><option>412</option></select>px</label><pre id="state">準備中…</pre><iframe id="frame" title="ロボ状態の実画面・仮データ" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></main><script src="../common/schema.js?v=89"></script><script src="../common/achievements.js?v=89"></script><script>
(async()=>{const base=new URL('../',location.href).href,frame=document.getElementById('frame');window.BoukenMaster={load:n=>fetch(base+'data/'+n+'.json').then(r=>r.json())};await BoukenAchievements.init();
async function load(){window.BoukenResultPreviewEpoch=(window.BoukenResultPreviewEpoch||0)+1;let html=await fetch(base+'home.html',{cache:'no-store'}).then(r=>r.text());html=html.replace('<meta charset="utf-8">','<base href="'+base+'"><meta charset="utf-8">').replace(/<script src="common\/save\.js[^\"]*"><\/script>/,'<script src="tests/result-fixture-save.js?v=89"><\/script>');frame.srcdoc=html;display();}
function display(){document.getElementById('state').textContent=JSON.stringify(window.BoukenResultPreviewData.robotGrowth,null,2);}
function seed(n,installed=0,active=true){const s=BoukenSchema.makeInitialSave();s.tutorialStory.complete=true;s.worldsStarted=3;s.characters=Object.fromEntries(Array.from({length:n},(_,i)=>[i+1,1]));s.robotGrowth.discovery=active?3:0;s.robotGrowth.partyCapacity=n>=293?5:n>=228?4:n>=131?3:n>=49?2:1;for(const f of BoukenSchema.robotFeatures.slice(0,installed))s.robotGrowth.features[f.id]={stage:4};BoukenAchievements.evaluate(s);BoukenAchievements.markNoticesShown(s,BoukenAchievements.pendingNotices(s).map(x=>x.id));window.BoukenResultPreviewData=s;return s;}
document.getElementById('hidden').onclick=()=>{seed(22,0,false);load();};document.getElementById('boot').onclick=()=>{seed(23);load();};document.getElementById('search').onclick=()=>{const s=seed(180,5);s.robotGrowth.features.drive2={stage:1,afterWorld:0};load();};document.getElementById('found').onclick=()=>{const s=seed(228,5);s.robotGrowth.partyCapacity=3;s.robotGrowth.features.drive2={stage:2,afterWorld:0,sourceWorld:1};s.robotGrowth.worldSerial=1;load();};document.getElementById('all').onclick=()=>{seed(316,10);load();};document.getElementById('reload').onclick=()=>load();document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='result-fixture-save')display();});seed(180,5).robotGrowth.features.drive2={stage:1,afterWorld:0};await load();})();
</script></html>
