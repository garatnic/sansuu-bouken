<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>施設イベント本体の開発用確認</title><style>body{font:15px system-ui;background:#edf3e9;color:#24402e;margin:16px}main{max-width:1100px;margin:auto}button,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #9db897;margin:4px;background:white;color:#24402e}button{background:#25704d;color:white;cursor:pointer}iframe{display:block;margin:12px auto;background:white;border:1px solid #bccdb4;width:390px;max-width:100%;height:720px}pre{white-space:pre-wrap;background:white;padding:12px}label{display:inline-block;margin:4px}</style><main><h1>施設イベント本体の開発用確認</h1><p>実際のワールド画面・抽選・保存ハンドラーを仮データで動かします。中央の町をタップしてください。実際のセーブは読み書きしません。</p><label>場面<select id="scene"><option value="newCharacter">仲間・初めて</option><option value="duplicateCharacter">仲間・重複</option><option value="failureCharacter">仲間・失敗</option><option value="retry">再勧誘・成功</option><option value="newItem">お宝・初めて</option><option value="duplicateItem">お宝・重複</option><option value="failureItem">お宝・失敗</option><option value="extra">追加のお宝</option><option value="choiceCharacter">仲間・候補選択</option><option value="choiceItem">お宝・候補選択</option></select></label><button id="reset">場面を開始</button><button id="resume">同じ仮セーブで再開</button><label><input type="checkbox" id="fail">保存失敗</label><label>幅<select id="width"><option value="390">390px</option><option value="800">800px</option><option value="320">320px</option></select></label><pre id="state">準備中</pre><iframe id="game" title="実際のワールド画面・仮データ" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></main><script src="../common/schema.js?v=69"></script><script>
(async()=>{const base=new URL('../',location.href).href,frame=document.getElementById('game'),output=document.getElementById('state');let html=await fetch(base+'world.html').then(r=>r.text());html=html.replace('<meta charset="utf-8">','<base href="'+base+'"><meta charset="utf-8">').replace(/<script src="common\/save\.js[^\"]*"><\/script>/,'<script src="tests/facility-event-fixture-save.js?v=69"><\/script>');
function report(){const s=window.BoukenFacilityFixture.data;output.textContent='仮データ：'+JSON.stringify({仲間:s.characters,お宝:s.items,訪問済み:s.world.visitedFacilities[12],候補:s.world.eventChoices[12]||null});}
function reset(){const scene=document.getElementById('scene').value,item=/Item|extra/.test(scene),choice=scene.startsWith('choice'),s=BoukenSchema.makeInitialSave();s.tutorialStory.complete=true;s.worldsStarted=3;s.world={width:5,height:5,startIndex:0,departureNumber:3,terrain:Array(25).fill('T01'),facility:Array(25).fill(null),explored:Array.from({length:25},(_,i)=>i!==24),revealed:Array(25).fill(false),visitedFacilities:Array(25).fill(false),events:Array(25).fill(null),eventPools:Array(25).fill(null),eventChoices:{},player:{x:2,y:2},exploredCount:23,partySnapshot:[],partyBuffsSnapshot:[]};const w=s.world;w.facility[12]='F01';w.events[12]=item?'collection':'companion';w.eventPools[12]='all';const ids=item?[1,2,3,4]:[298,199,1,2];w.eventChoices[12]={type:w.events[12],pool:'all',ids:choice?ids:[ids[0]],requiresChoice:choice};if(choice)w.partyBuffsSnapshot.push({id:item?'F01':'F02',level:3});if(scene==='extra')w.partyBuffsSnapshot.push({id:'C03',level:3});if(scene==='retry')w.partyBuffsSnapshot.push({id:'D07',level:3});if(scene.startsWith('duplicate'))(item?s.items:s.characters)[ids[0]]=2;window.BoukenFacilityFixture={data:s,failure:scene.startsWith('failure'),retry:scene==='retry',fail:document.getElementById('fail').checked};frame.srcdoc=html;report();}
document.getElementById('reset').onclick=reset;document.getElementById('resume').onclick=()=>{frame.srcdoc=html;report()};document.getElementById('fail').onchange=e=>window.BoukenFacilityFixture.fail=e.target.checked;document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='facility-fixture-save')report();});reset();})();
</script></html>
