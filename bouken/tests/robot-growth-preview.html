<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ぼうけんロボ成長 Phase 1 確認</title><style>body{font:15px system-ui;background:#edf3e9;color:#24402e;margin:16px}main{max-width:850px;margin:auto}button,select{font:inherit;padding:12px;margin:4px;border:1px solid #9db897;border-radius:9px}button{background:#25704d;color:white}iframe{display:block;width:390px;max-width:100%;height:740px;margin:14px auto;border:1px solid #abc;border-radius:12px;background:white}pre{white-space:pre-wrap}</style><main><h1>ぼうけんロボ成長 Phase 1 確認</h1><p>実画面を仮データで確認します。通常のセーブは読み書きしません。ホームへの移動は下の専用ボタンで行ってください。</p><button id="pending">23種類・発見待機</button><button id="complete">23種類・完全クリア</button><button id="priority">49種類・枠と起動が重複</button><button id="home">仮データでホームへ</button><button id="reload">仮データを再読込</button><label>幅<select id="width"><option>390</option><option>320</option><option>412</option><option>680</option></select>px</label><label><input id="fail" type="checkbox">保存を失敗させる</label><pre id="state">準備中…</pre><iframe id="frame" title="ロボ成長の実画面・仮データ" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></main><script src="../common/schema.js?v=82"></script><script src="../common/worldgen.js?v=82"></script><script src="../common/result.js?v=82"></script><script>
(async()=>{const base=new URL('../',location.href).href,frame=document.getElementById('frame');const [terrains,facilities,counts]=await Promise.all(['terrains','facilities','world_facility_counts'].map(n=>fetch(base+'data/'+n+'.json').then(r=>r.json())));let page='world.html';
async function load(next=page){page=next;window.BoukenResultPreviewEpoch=(window.BoukenResultPreviewEpoch||0)+1;let html=await fetch(base+page).then(r=>r.text());html=html.replace('<meta charset="utf-8">','<base href="'+base+'"><meta charset="utf-8">').replace(/<script src="common\/save\.js[^\"]*"><\/script>/,'<script src="tests/result-fixture-save.js?v=82"><\/script>');frame.srcdoc=html;document.getElementById('state').textContent=JSON.stringify(window.BoukenResultPreviewData.robotGrowth);}
function seed(n=23,complete=false){const s=BoukenSchema.makeInitialSave();s.tutorialStory.complete=true;s.worldsStarted=3;s.characters=Object.fromEntries(Array.from({length:n},(_,i)=>[i+1,1]));const w=BoukenWorldGen.generate(10,10,terrains,facilities,counts,[]);w.departureNumber=3;w.partySnapshot=[];w.partyBuffsSnapshot=[];w.b01VisionInitialized=true;BoukenResult.start(w);s.world=w;BoukenSchema.growth(s);if(complete){w.explored.fill(true);w.visitedFacilities=w.facility.map(Boolean);w.completionRecorded=true;w.allExploredRewardClaimed=true;w.exploredCount=99;BoukenResult.finish(s,w);}window.BoukenResultPreviewData=s;return s;}
document.getElementById('pending').onclick=()=>{seed();load('world.html');};document.getElementById('complete').onclick=()=>{seed(23,true);load('world.html');};document.getElementById('priority').onclick=()=>{const s=seed(49);s.robotGrowth.discovery=2;load('home.html');};document.getElementById('home').onclick=()=>load('home.html');document.getElementById('reload').onclick=()=>load();document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';document.getElementById('fail').onchange=e=>window.BoukenResultPreviewFail=e.target.checked;window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='result-fixture-save')document.getElementById('state').textContent=JSON.stringify(window.BoukenResultPreviewData.robotGrowth);});seed();await load();})();
</script></html>
