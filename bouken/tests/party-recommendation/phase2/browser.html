<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おすすめパーティー 第2段階・独立検証</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f1;color:#193429;font:16px/1.6 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:18px}h1{font-size:1.4rem}section{background:white;border-radius:14px;padding:16px;margin:16px 0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}label{display:flex;flex-direction:column;font-weight:600}select,input,button{font:inherit;padding:10px;min-height:46px;border-radius:8px;border:1px solid #829b8b;max-width:100%}button{background:#246c4a;color:white;border:0;cursor:pointer;margin:5px 6px 5px 0}button:disabled{opacity:.5;cursor:default}button.secondary{background:#536574}button.stop{background:#a73b37}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:9px;border-bottom:1px solid #dce5df;text-align:left;white-space:nowrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85rem}.note{font-size:.9rem;color:#496354}#status{font-weight:600}#heartbeat{font-variant-numeric:tabular-nums}a{color:#17613d}@media(max-width:420px){main{padding:10px}section{padding:12px}h1{font-size:1.2rem}}
</style></head><body><main><h1>おすすめパーティー 第2段階・独立検証</h1><p class="note">合成データだけを使う開発用ページです。ゲームのセーブを読み書きしません。スマートフォンの速度は、ご自身の端末で測定してください。</p><section><form id="settings">
<label>仲間の種類数<select id="count"><option>30</option><option selected>100</option><option>140</option><option>279</option><option>500</option><option>927</option></select></label>
<label>マップ<select id="size"><option value="10">10×10</option><option value="20">20×20</option><option value="30">30×30</option></select></label>
<label>お宝の所有割合<select id="items"><option value="0.05">序盤 約5%</option><option selected value="0.5">中盤 約50%</option><option value="0.95">終盤 約95%</option></select></label>
<label>博物館<select id="claims"><option value="0">未受取</option><option value="80">多数受取済み</option></select></label>
<label>目標大分類<input id="target" value="04" pattern="0[1-9]|1[0-9]|2[0-4]" required></label>
<label>計算量<select id="mode"><option value="quick">短時間（目安10秒）</option><option value="standard">追加探索（目安60秒）</option></select></label>
</form><button id="start">探索を開始</button><button id="continue" class="secondary" disabled>現在の候補から追加探索</button><button id="cancel" class="stop" disabled>計算を中止</button><p class="note">時間上限は処理の区切りで確認するため超過する場合があります。中止はWorkerを終了します。</p></section>
<section aria-live="polite"><p id="status">開始ボタンを押してください。</p><p id="heartbeat">画面応答：待機中</p><div class="scroll"><table><thead><tr><th>タイプ</th><th>仲間ID</th><th>開拓</th><th>お宝</th><th>仲間</th><th>探索</th><th>試行数</th></tr></thead><tbody id="rows"></tbody></table></div><p class="note">927種類加入済みでは、新規加入は増えず、勧誘成功回数を代替指標にしています。点数は固定参照集団に対する相対評価です。少数試行の結果を確定推薦とは扱いません。</p><button id="download" class="secondary" disabled>測定結果JSONを保存</button><details><summary>測定ログ</summary><pre id="log"></pre></details></section><p><a href="../README.md">実行手順・第1段階</a></p></main><script src="./browser.js"></script></body></html>
