<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロボ機能解放 Phase 3 確認</title><style>body{font:15px system-ui;background:#edf3e9;color:#24402e;margin:16px}main{max-width:900px;margin:auto}button,select{font:inherit;padding:10px;margin:4px;border:1px solid #9db897;border-radius:9px}button{background:#25704d;color:white}iframe{display:block;width:390px;max-width:100%;height:740px;margin:14px auto;border:1px solid #abc;border-radius:12px;background:white}pre{max-height:110px;overflow:auto;white-space:pre-wrap}</style><main><h1>ロボ機能解放 Phase 3 確認</h1><p>通常のセーブを読み書きしない仮データです。編成画面・自動編成画面・冒険画面は本体を実行します。</p><button id="locked">ロボ未起動・多数所持</button><button id="part">分析部品を所持・未装着</button><button id="analysis">分析だけ解放</button><button id="random">ランダムまで解放</button><button id="mapMode">マップ探索まで解放</button><button id="all">全機能解放</button><button id="drive0">運転未解放</button><button id="drive1">運転Lv.1</button><button id="drive2">運転Lv.2</button><button id="drive3">運転Lv.3</button><button id="reload">仮データを再読込</button><label>幅<select id="width"><option>390</option><option>320</option><option>412</option></select>px</label><pre id="state">準備中…</pre><iframe id="frame" title="ロボ機能解放の実画面・仮データ" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></main><script src="../common/schema.js?v=85"></script><script src="../common/worldgen.js?v=85"></script><script src="../common/result.js?v=85"></script><script>
(async()=>{const base=new URL('../',location.href).href,frame=document.getElementById('frame');const [terrains,facilities,counts,characters]=await Promise.all(['terrains','facilities','world_facility_counts','characters'].map(n=>fetch(base+'data/'+n+'.json').then(r=>r.json())));let page='party.html';
function state(){const s=window.BoukenResultPreviewData;document.getElementById('state').textContent=JSON.stringify({access:BoukenSchema.robotAccess(s),party:s.party,save:s.robotGrowth},null,2);}
async function load(next=page){page=next;window.BoukenResultPreviewEpoch=(window.BoukenResultPreviewEpoch||0)+1;let html=await fetch(base+page,{cache:'no-store'}).then(r=>r.text());html=html.replace('<meta charset="utf-8">','<base href="'+base+'"><meta charset="utf-8">').replace(/<script src="common\/save\.js[^\"]*"><\/script>/,'<script src="tests/result-fixture-save.js?v=85"><\/script>');frame.srcdoc=html;state();}
function seed(until=-1,n=316){const s=BoukenSchema.makeInitialSave();s.tutorialStory.complete=true;s.worldsStarted=3;s.characters=Object.fromEntries(characters.slice(0,n).map(c=>[c.id,1]));s.robotGrowth.discovery=until<0?0:3;s.robotGrowth.partyCapacity=n>=293?5:n>=228?4:n>=131?3:n>=49?2:1;s.party=characters.slice(0,s.robotGrowth.partyCapacity).map(c=>c.id);for(const f of BoukenSchema.robotFeatures.slice(0,Math.max(0,until)))s.robotGrowth.features[f.id]={stage:4};window.BoukenResultPreviewData=s;return s;}
function party(until,n){seed(until,n);load('party.html');}
document.getElementById('locked').onclick=()=>party(-1,316);document.getElementById('part').onclick=()=>{const s=seed(0,29);s.robotGrowth.features.analysis={stage:2};load('party.html');};document.getElementById('analysis').onclick=()=>party(1,29);document.getElementById('random').onclick=()=>party(2,70);document.getElementById('mapMode').onclick=()=>party(4,111);document.getElementById('all').onclick=()=>party(10,316);
function drive(until){const s=seed(until),w=BoukenWorldGen.generate(10,10,terrains,facilities,counts,[]);w.player={x:0,y:0};w.startIndex=0;w.explored.fill(false);w.explored[0]=true;w.revealed.fill(false);w.facility.fill(null);w.events.fill(null);w.visitedFacilities.fill(false);w.departureNumber=3;w.partySnapshot=s.party.slice();w.partyBuffsSnapshot=[];w.b01VisionInitialized=true;BoukenResult.start(w);s.world=w;load('world.html');}
for(const [id,n]of [['drive0',2],['drive1',3],['drive2',6],['drive3',9]])document.getElementById(id).onclick=()=>drive(n);
document.getElementById('reload').onclick=()=>load();document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='result-fixture-save')state();});party(-1,316);})();
</script></html>
