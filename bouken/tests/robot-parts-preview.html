<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロボ部品・強化 Phase 2 確認</title><style>body{font:15px system-ui;background:#edf3e9;color:#24402e;margin:16px}main{max-width:900px;margin:auto}button,select{font:inherit;padding:10px;margin:4px;border:1px solid #9db897;border-radius:9px}button{background:#25704d;color:white}iframe{display:block;width:390px;max-width:100%;height:740px;margin:14px auto;border:1px solid #abc;border-radius:12px;background:white}pre{white-space:pre-wrap}</style><main><h1>ロボ部品・強化 Phase 2 確認</h1><p>通常セーブに触れない仮データです。各画面は本体HTMLを実行します。画面移動は下の専用ボタンを使ってください。</p><button id="announce">29種類・探索告知</button><button id="before">告知前に生成した10×10</button><button id="matching">告知後の10×10・あと1マス</button><button id="wrong">告知後の20×20・あと1マス</button><button id="install">部品取得済み・強化待ち</button><button id="help">取り付け済み・説明待ち</button><button id="drive2">180種類・20×20探索</button><button id="home">仮データでホームへ</button><button id="reload">仮データを再読込</button><label>幅<select id="width"><option>390</option><option>320</option><option>412</option></select>px</label><label><input id="fail" type="checkbox">保存失敗</label><pre id="state">準備中…</pre><iframe id="frame" title="ロボ部品の実画面・仮データ" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></main><script src="../common/schema.js?v=84"></script><script src="../common/worldgen.js?v=84"></script><script src="../common/result.js?v=84"></script><script src="../common/progress.js?v=84"></script><script>
(async()=>{const base=new URL('../',location.href).href,frame=document.getElementById('frame'),out=document.getElementById('state');const [terrains,facilities,counts,characters]=await Promise.all(['terrains','facilities','world_facility_counts','characters'].map(n=>fetch(base+'data/'+n+'.json').then(r=>r.json())));let page='home.html';
function display(){out.textContent=JSON.stringify({growth:window.BoukenResultPreviewData.robotGrowth,part:window.BoukenResultPreviewData.world?.robotPartReward},null,2);}
async function load(next=page){page=next;window.BoukenResultPreviewEpoch=(window.BoukenResultPreviewEpoch||0)+1;let html=await fetch(base+page,{cache:'no-store'}).then(r=>r.text());html=html.replace('<meta charset="utf-8">','<base href="'+base+'"><meta charset="utf-8">').replace(/<script src="common\/save\.js[^\"]*"><\/script>/,'<script src="tests/result-fixture-save.js?v=84"><\/script>');frame.srcdoc=html;display();}
function seed(n=29){const s=BoukenSchema.makeInitialSave();s.tutorialStory.complete=true;s.worldsStarted=3;s.characters=Object.fromEntries(characters.slice(0,n).map(c=>[c.id,1]));s.robotGrowth.discovery=3;s.robotGrowth.partyCapacity=n>=131?3:n>=49?2:1;window.BoukenResultPreviewData=s;return s;}
function near(s,n=10,bind=true){const w=BoukenWorldGen.generate(n,n,terrains,facilities,counts,[]);w.departureNumber=4;w.partySnapshot=[];w.partyBuffsSnapshot=[];w.b01VisionInitialized=true;BoukenResult.start(w);if(bind)BoukenSchema.robotWorld(s,w);w.explored.fill(true);const target=w.startIndex%n<n-1?w.startIndex+1:w.startIndex-1;w.explored[target]=false;w.exploredCount=n*n-2;w.visitedFacilities.fill(false);s.world=w;return w;}
document.getElementById('announce').onclick=()=>{seed();load('home.html');};document.getElementById('matching').onclick=()=>{const s=seed();BoukenSchema.announceRobotSearch(s);near(s);load('world.html');};document.getElementById('before').onclick=()=>{const s=seed();near(s);BoukenSchema.announceRobotSearch(s);load('world.html');};document.getElementById('wrong').onclick=()=>{const s=seed();BoukenSchema.announceRobotSearch(s);near(s,20);load('world.html');};
function obtained(){const s=seed();BoukenSchema.announceRobotSearch(s);const w=near(s);w.explored.fill(true);BoukenProgress.recordMilestones(s,w,undefined,characters);return s;}
document.getElementById('install').onclick=()=>{obtained();load('home.html');};document.getElementById('help').onclick=()=>{const s=obtained();BoukenSchema.installRobotPart(s,'analysis');load('home.html');};document.getElementById('drive2').onclick=()=>{const s=seed(180);for(const f of BoukenSchema.robotFeatures.slice(0,5))s.robotGrowth.features[f.id]={stage:4};load('home.html');};document.getElementById('home').onclick=()=>load('home.html');document.getElementById('reload').onclick=()=>load();document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';document.getElementById('fail').onchange=e=>window.BoukenResultPreviewFail=e.target.checked;window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='result-fixture-save')display();});seed();await load();})();
</script></html>
