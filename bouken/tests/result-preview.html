<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リザルト確認用・仮セーブ</title><style>body{font:15px system-ui;background:#edf3e9;color:#24402e;margin:16px}main{max-width:900px;margin:auto}button,select{font:inherit;padding:12px;margin:4px;border:1px solid #9db897;border-radius:9px}button{background:#25704d;color:white}iframe{display:block;width:390px;max-width:100%;height:740px;margin:14px auto;border:1px solid #abc;border-radius:12px;background:white}pre{white-space:pre-wrap}</style><main><h1>リザルト確認用・仮セーブ</h1><p>実際の画面を仮データで実行します。通常のセーブには触れません。遭遇履歴・時間は確認用の架空の値です。</p><button id="small">10×10：クリア直前</button><button id="large">30×30：クリア直前</button><button id="zero">0問のリザルト</button><button id="reload">仮セーブを再読込</button><button id="records">記録・実績で見る</button><label>幅<select id="width"><option>390</option><option>320</option><option>412</option><option>680</option></select>px</label><label><input id="fail" type="checkbox">保存を失敗させる</label><pre id="state">準備中…</pre><iframe id="frame" title="実際のリザルトと冒険画面・仮データ" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></main><script src="../common/schema.js?v=75"></script><script src="../common/master.js?v=75"></script><script src="../common/worldgen.js?v=75"></script><script src="../common/result.js?v=75"></script><script>
(async()=>{const base=new URL('../',location.href).href,frame=document.getElementById('frame');const [terrains,facilities,counts]=await Promise.all(['terrains','facilities','world_facility_counts'].map(n=>fetch(base+'data/'+n+'.json').then(r=>{if(!r.ok)throw Error('確認用マスター読込失敗');return r.json();})));let currentPage='world.html';
async function load(page=currentPage){window.BoukenResultPreviewEpoch=(window.BoukenResultPreviewEpoch||0)+1;currentPage=page;let html=await fetch(base+page).then(r=>r.text());html=html.replace('<meta charset="utf-8">','<base href="'+base+'"><meta charset="utf-8">').replace(/<script src="common\/save\.js[^\"]*"><\/script>/,'<script src="tests/result-fixture-save.js?v=75"><\/script>');frame.srcdoc=html;}
function seed(n){const s=BoukenSchema.makeInitialSave();s.tutorialStory.complete=true;s.worldsStarted=3;const w=BoukenWorldGen.generate(n,n,terrains,facilities,counts,[]);w.departureNumber=3;w.partySnapshot=[];w.partyBuffsSnapshot=[];w.explored.fill(true);w.explored[0]=false;w.facility.fill(null);w.facility[1]='F01';w.events.fill(null);w.events[1]='collection';w.visitedFacilities.fill(false);w.exploredCount=n*n-2;w.b01VisionInitialized=true;BoukenResult.start(w);Object.assign(w.adventureStats,{elapsedActiveMs:5025000,solved:n*n-2,firstTryCorrect:n*n-5,manualOpened:n*n-2,maxFirstTryStreak:17,encounters:[{type:'companion',id:298,name:'グリーンゴブ',success:true,firstAcquired:true,source:'facility'},{type:'collection',id:1,name:'思い出のお宝',success:false,firstAcquired:false,source:'facility'},{type:'companion',id:298,name:'グリーンゴブ',success:false,firstAcquired:false,source:'facility'},{type:'collection',id:2,name:'もう一つのお宝',success:true,firstAcquired:false,source:'facility'}]});w.adventureStats.byOperation.add={solved:n*n-2,firstTryCorrect:n*n-5};s.world=w;window.BoukenResultPreviewData=s;return s;}
document.getElementById('small').onclick=()=>{seed(10);load('world.html');};document.getElementById('large').onclick=()=>{seed(30);load('world.html');};document.getElementById('zero').onclick=()=>{const s=seed(10);BoukenResult.start(s.world);s.world.explored.fill(true);s.world.visitedFacilities[1]=true;s.world.completionRecorded=true;BoukenResult.finish(s,s.world);load('world.html');};document.getElementById('reload').onclick=()=>load();document.getElementById('records').onclick=()=>load('records.html');document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';document.getElementById('fail').onchange=e=>window.BoukenResultPreviewFail=e.target.checked;window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='result-fixture-save')document.getElementById('state').textContent=JSON.stringify(e.data);});seed(10);await load();})();
</script></html>
