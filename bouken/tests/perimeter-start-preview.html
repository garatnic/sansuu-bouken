<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外周開始・A11確認</title><style>body{font:16px system-ui;margin:16px;background:#edf3e9}button,select{font:inherit;padding:8px;margin:5px}iframe{display:block;width:390px;max-width:100%;height:740px;margin:12px 0;border:1px solid #abc}pre{white-space:pre-wrap}</style><h1>外周開始・A11確認</h1><p>通常セーブを読み書きしない仮データ。実際の生成・初期開拓・ワールド画面を使用します。</p><label>サイズ<select id="size"><option>5</option><option>10</option><option>20</option><option selected>30</option></select></label><label>A11<select id="level"><option>0</option><option>1</option><option>2</option><option selected>3</option></select></label><label>開始位置<select id="start"><option value="0">左上</option><option value="0.25">上辺</option><option value="0.5">左右辺</option><option value="0.999999" selected>右下</option></select></label><button id="generate">生成</button><button id="resume">再読み込み</button><pre id="state"></pre><iframe id="frame" title="実際の冒険画面・仮セーブ" sandbox="allow-scripts allow-same-origin allow-modals"></iframe><script src="../common/schema.js?v=95"></script><script src="../common/worldgen.js?v=95"></script><script src="../common/explore.js?v=95"></script><script src="../common/buffs.js?v=95"></script><script src="../common/result.js?v=95"></script><script>
(async()=>{const base=new URL('../',location.href).href,frame=document.getElementById('frame'),state=document.getElementById('state'),masters=await Promise.all(['terrains','facilities','world_facility_counts'].map(n=>fetch(base+'data/'+n+'.json').then(r=>r.json())));let page='world.html';
async function load(p=page){page=p;window.BoukenResultPreviewEpoch=(window.BoukenResultPreviewEpoch||0)+1;let html=await fetch(base+p).then(r=>r.text());html=html.replace('<meta charset="utf-8">','<base href="'+base+'"><meta charset="utf-8">').replace(/<script src="common\/save\.js[^\"]*"><\/script>/,'<script src="tests/result-fixture-save.js?v=95"><\/script>');frame.srcdoc=html;}
function report(){const w=window.BoukenResultPreviewData.world;state.textContent=JSON.stringify({size:w.width,startIndex:w.startIndex,player:w.player,opened:w.explored.filter(Boolean).length-1,A11:w.partyBuffsSnapshot[0].level},null,2);}
async function generate(){const n=Number(document.getElementById('size').value),lv=Number(document.getElementById('level').value),r=Number(document.getElementById('start').value),rng=Math.random;let first=true,w;try{Math.random=()=>{if(first){first=false;return r;}return rng();};w=BoukenWorldGen.generate(n,n,...masters);}finally{Math.random=rng;}w.partyBuffsSnapshot=[{id:'A11',level:lv}];BoukenBuffs.initial(w);w.departureNumber=3;w.b01VisionInitialized=true;BoukenResult.start(w);const s=BoukenSchema.makeInitialSave();s.tutorialStory.complete=true;s.worldsStarted=3;s.world=w;s.robotGrowth.discovery=3;for(const id of ['drive1','drive2','drive3'])s.robotGrowth.features[id]={stage:4};window.BoukenResultPreviewData=s;report();await load('world.html');}
window.BoukenResultPreviewNavigate=p=>load(p);document.getElementById('generate').onclick=generate;document.getElementById('resume').onclick=()=>load();window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='result-fixture-save')report();});await generate();})();
</script></html>
