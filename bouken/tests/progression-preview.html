<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成長通知・受取の開発用確認</title><link rel="stylesheet" href="../common/notice-dialog.css?v=68"><style>body{font:15px system-ui;background:#edf3e9;color:#24402e;margin:20px}main{max-width:900px;margin:auto}button,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #9db897;background:white;color:#24402e;margin:4px;cursor:pointer}button{background:#25704d;color:white}iframe{display:block;margin:12px auto;background:white;border:1px solid #bccdb4;border-radius:12px;width:390px;max-width:100%;height:720px}pre{white-space:pre-wrap;background:white;padding:12px;border-radius:9px}</style><main><h1>成長通知・受取の開発用確認</h1><p>実画面のコードを仮データで実行します。実際のlocalStorageを読み書きしません。ゲーム本体への移動はテスト対象外です。</p><button id="notices">パーティー解放・コンプ通知を試す</button><button id="unclaimed">博物館：未受取</button><button id="claimed">博物館：受取済み</button><label>画面幅<select id="width"><option value="390">390px</option><option value="680">680px</option></select></label><pre id="state">準備中…</pre><iframe id="museum" title="実際の博物館画面・仮データ" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></main><script src="../common/schema.js?v=68"></script><script src="../common/party.js?v=68"></script><script src="../common/collection.js?v=68"></script><script src="../common/notice-dialog.js?v=68"></script><script src="../common/home-growth-notice.js?v=68"></script><script>
(async()=>{
 const base=new URL('../',location.href).href,frame=document.getElementById('museum'),output=document.getElementById('state');
 const [items,rewards]=await Promise.all(['collection_items','collection_rewards'].map(n=>fetch(base+'data/'+n+'.json').then(r=>r.json())));BoukenCollection.configure(items,rewards);
 function seed(){const s=BoukenSchema.makeInitialSave();s.tutorialStory.complete=true;s.characters=Object.fromEntries(Array.from({length:47},(_,i)=>[i+1,1]));s.items={1:1,2:1,3:1,4:1,5:1};return s;}
 let noticeData=seed();window.BoukenSave={load:()=>structuredClone(noticeData),save:s=>{noticeData=structuredClone(s);output.textContent='通知保存後：'+JSON.stringify(BoukenHomeGrowthNotice.pending(noticeData));return structuredClone(noticeData);}};
 document.getElementById('notices').onclick=async()=>{noticeData=seed();await BoukenHomeGrowthNotice.show({goMuseum:()=>museum(false)});};
 async function museum(claimed){window.BoukenPreviewData=seed();if(claimed)BoukenCollection.claim(window.BoukenPreviewData,'01-1');let html=await fetch(base+'collection.html').then(r=>r.text());html=html.replace('<meta charset="utf-8">','<base href="'+base+'"><meta charset="utf-8">').replace(/<script src="common\/save\.js[^\"]*"><\/script>/,'<script src="tests/progression-fixture-save.js"><\/script>');frame.srcdoc=html;output.textContent=claimed?'受取済みの1段階：+0.2ポイント':'未受取：ボーナス0段階';}
 document.getElementById('unclaimed').onclick=()=>museum(false);document.getElementById('claimed').onclick=()=>museum(true);document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='fixture-save')output.textContent='博物館の仮データ保存：'+JSON.stringify(e.data.claimed);});await museum(false);
})();
</script></html>
