<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>じどううんてんロボ確認用</title><style>body{font:15px system-ui;background:#edf3e9;color:#24402e;margin:16px}main{max-width:900px;margin:auto}button,select{font:inherit;padding:10px;margin:4px;border-radius:9px;border:1px solid #abc}button{background:#25704d;color:white}iframe{display:block;width:390px;max-width:100%;height:740px;margin:14px auto;border:1px solid #abc;background:white}pre{white-space:pre-wrap}</style><main><h1>じどううんてんロボ確認用</h1><p>通常セーブは読み書きしません。現在地は左上。遠方の黒マスをタップしてルートを確認し、しゅっぱつ！を押してください。</p><button id="plain">基本</button><button id="buff">スキルあり</button><button id="facility">施設発見</button><button id="vision">透視で見える塔</button><button id="corridor">開拓済み経由</button><button id="remote">離れた黄色枠</button><button id="legacy">旧ワールド</button><button id="createPage">出発画面</button><button id="recordsPage">記録画面</button><button id="reload">再読み込み</button><label>幅<select id="width"><option>390</option><option>320</option><option>412</option><option>680</option></select>px</label><label><input id="fail" type="checkbox">保存失敗</label><pre id="state">準備中</pre><iframe id="frame" title="実際の冒険画面・仮セーブ" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></main><script src="../common/schema.js?v=81"></script><script src="../common/worldgen.js?v=81"></script><script src="../common/result.js?v=81"></script><script>
(async()=>{const base=new URL('../',location.href).href,frame=document.getElementById('frame');const [terrains,facilities,counts]=await Promise.all(['terrains','facilities','world_facility_counts'].map(n=>fetch(base+'data/'+n+'.json').then(r=>r.json())));
let currentPage='world.html';async function load(page=currentPage){currentPage=page;window.BoukenResultPreviewEpoch=(window.BoukenResultPreviewEpoch||0)+1;let html=await fetch(base+page).then(r=>r.text());html=html.replace('<meta charset="utf-8">','<base href="'+base+'"><meta charset="utf-8">').replace(/<script src="common\/save\.js[^\"]*"><\/script>/,'<script src="tests/result-fixture-save.js?v=81"><\/script>');html=html.replace("location.href='worldcreate.html'","parent.BoukenResultPreviewNavigate('worldcreate.html')");frame.srcdoc=html;}window.BoukenResultPreviewNavigate=page=>load(page);document.getElementById('createPage').onclick=()=>load('worldcreate.html');document.getElementById('recordsPage').onclick=()=>load('records.html');
function seed(mode){const s=BoukenSchema.makeInitialSave();s.tutorialStory.complete=true;s.worldsStarted=3;const w=BoukenWorldGen.generate(10,10,terrains,facilities,counts,[]);w.departureNumber=3;w.partySnapshot=[];w.partyBuffsSnapshot=mode==='buff'?[{id:'A02',level:3},{id:'A01',level:3},{id:'B01',level:3}]:[];w.explored.fill(false);w.revealed.fill(false);w.explored[0]=true;w.startIndex=0;w.player={x:0,y:0};w.exploredCount=0;w.facility.fill(null);w.events.fill(null);w.visitedFacilities.fill(false);w.b01VisionInitialized=true;if(mode==='vision'){w.partyBuffsSnapshot=[{id:'B01',level:1}];w.facility[2]='F07';w.events[2]='collection';}if(mode==='facility'){w.facility[1]='F01';w.events[1]='collection';w.facility[2]='F03';w.events[2]='companion';}if(mode==='remote'){for(const i of [20,21,22])w.explored[i]=true;w.exploredCount=3;}if(mode==='corridor'){for(let i=1;i<=7;i++)w.explored[i]=true;w.exploredCount=7;}BoukenResult.start(w);if(mode==='legacy')delete w.adventureStats;w.partySnapshot=[298];s.characters[298]=1;s.items[1]=2;s.world=w;window.BoukenResultPreviewData=s;}
for(const mode of ['plain','buff','facility','vision','corridor','remote','legacy'])document.getElementById(mode).onclick=()=>{seed(mode);load('world.html');};document.getElementById('reload').onclick=()=>load();document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';document.getElementById('fail').onchange=e=>window.BoukenResultPreviewFail=e.target.checked;window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='result-fixture-save'){const w=window.BoukenResultPreviewData.world;document.getElementById('state').textContent=w?'開拓 '+w.exploredCount+' ／ 現在地 '+w.player.x+','+w.player.y:'ワールドなし ／ リザルト '+window.BoukenResultPreviewData.lastClearResult?.status;}});seed('plain');await load();})();
</script></html>
