<!doctype html><html lang="ja"><head><title>タイトル | 算数ぼうけん</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><style>body{font-family:system-ui,sans-serif;background:#f5f8f4;color:#1e3327;margin:0;padding:20px;max-width:650px;margin-inline:auto}h1{font-size:1.6rem}button,.button{display:block;box-sizing:border-box;width:100%;padding:16px;margin:12px 0;border:0;border-radius:12px;background:#25704d;color:white;font-size:1.1rem;text-align:center;text-decoration:none;cursor:pointer}.muted{color:#53675b}.panel{background:white;border-radius:14px;padding:18px;margin:14px 0}small{color:#53675b}a.button.disabled{background:#888;pointer-events:none;opacity:.7}#saveStatus{font-size:.95rem;line-height:1.5}</style></head><body><main class="panel"><h1>算数ぼうけん</h1><p>まだ じゅんびちゅうの ぼうけんのせかい</p><a id="start" class="button" href="home.html">ぼうけんをはじめる</a><p id="saveStatus" class="muted" role="status"></p><button id="debugAdd" type="button" style="background:#526d94">デバッグ：ランダムな仲間を1人追加</button><p id="debugStatus" class="muted" role="status"></p><button id="resetSave" type="button" style="background:#7b3b3b">セーブデータを削除</button><small>開発版 <span id="version">ver.?</span>（画面構成の確認用）</small></main><script src="common/version.js?v=36"></script><script>document.getElementById("version").textContent = "ver." + window.BoukenVersion;</script><script src="common/schema.js?v=36"></script><script src="common/save.js?v=36"></script><script src="common/master.js?v=36"></script><script>
(function(){
 const start=document.getElementById('start');
 const status=document.getElementById('saveStatus');
 const prefix='bouken.save.';
 function keys(){return Object.keys(localStorage).filter(k=>k.startsWith(prefix));}
 function refresh(){
   try{
     const all=keys();
     const other=all.filter(k=>k!==BoukenSchema.key);
     let problem='';
     if(other.length) problem='別の保存形式のデータがあります。';
     const raw=localStorage.getItem(BoukenSchema.key);
     if(raw!==null){
       try{const obj=JSON.parse(raw);if(!obj||obj.schemaVersion!==BoukenSchema.version)problem='保存形式が現在のゲームと一致しません。';}
       catch(e){problem='保存データを読み取れません。';}
     }
     start.classList.toggle('disabled',!!problem);
     start.setAttribute('aria-disabled',problem?'true':'false');
     status.textContent=problem?'ぼうけんを開始できません。'+problem+' セーブデータを削除してください。':'セーブ形式は利用可能です。';
   }catch(e){start.classList.add('disabled');start.setAttribute('aria-disabled','true');status.textContent='保存領域を確認できません。ブラウザの設定を確認してください。';}
 }
 start.addEventListener('click',e=>{if(start.classList.contains('disabled'))e.preventDefault();});
 document.getElementById('debugAdd').addEventListener('click',async()=>{
   const btn=document.getElementById('debugAdd'),out=document.getElementById('debugStatus');
   btn.disabled=true;out.textContent='仲間データを読み込み中…';
   try{
     if(start.classList.contains('disabled'))throw Error('セーブ形式が一致しないため追加できません。');
     const characters=await BoukenMaster.load('characters');
     if(!Array.isArray(characters)||!characters.length)throw Error('仲間マスターが空です。');
     const chosen=characters[Math.floor(Math.random()*characters.length)];
     const data=BoukenSave.load();
     data.characters=data.characters||{};
     const old=Number(data.characters[chosen.id]||0);
     data.characters[chosen.id]=old+1;
     BoukenSave.save(data);
     out.textContent=`${chosen.name}（No.${chosen.id}）が仲間になりました！ ${old?'重複獲得：所持'+(old+1)+'体':'初獲得'}`;
     refresh();
   }catch(e){out.textContent='追加できませんでした：'+e.message}
   finally{btn.disabled=false}
 });
 document.getElementById('resetSave').addEventListener('click',()=>{
   if(!confirm('算数ぼうけんのセーブデータをすべて削除します。仲間・収集品・記録・進行中のワールドも元に戻せません。削除しますか？'))return;
   try{keys().forEach(k=>localStorage.removeItem(k));refresh();status.textContent='算数ぼうけんのセーブデータを削除しました。';}
   catch(e){status.textContent='削除できませんでした。ブラウザの保存設定を確認してください。';}
 });
 refresh();
})();
</script></body></html>
