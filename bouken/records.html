<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記録・実績｜算数ぼうけん</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f1;color:#233e30;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:16px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:25px}h2{font-size:17px;background:#285b40;color:white;padding:12px;border-radius:10px;margin-top:24px}a,button{background:#28744f;color:white;border:0;border-radius:9px;padding:10px;text-decoration:none;font:inherit;cursor:pointer}input,select{font:inherit;padding:10px;border:1px solid #ccd9c8;border-radius:9px;min-width:0}input{flex:1}.panel,.card{background:white;border:1px solid #dde6d6;border-radius:13px;padding:15px;margin:10px 0}.card.done{background:#f1f7e8;border-color:#99ba81}.muted{font-size:12px;color:#718271;line-height:1.7}.bar{height:7px;background:#e4ebdd;border-radius:7px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#62a176}.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.counts b{display:block;font-size:23px;margin-top:5px}.badge{font-size:12px;color:#9a651a;white-space:nowrap}strong{font-size:15px}.toolbar{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}@media(max-width:420px){main{padding:12px}h1{font-size:23px}header a{font-size:12px}input{width:100%}}</style><link rel="stylesheet" href="common/screen-ui.css?v=100"><link rel="stylesheet" href="common/result.css?v=100"><main><header><h1>記録・実績</h1><a href="home.html">ホームに戻る</a></header><div id="status" class="page-status" role="status">記録を読み込んでいます…</div><section id="summary"></section><div class="toolbar"><input id="search" placeholder="称号・条件でさがす" aria-label="称号検索"><select id="filter" aria-label="達成状態"><option value="all">すべて</option><option value="done">獲得済み</option><option value="pending">未獲得</option></select></div><div id="list"></div><p class="muted">称号は自動で記録され、装備や能力アップはありません。過去に保存されていた記録と所持状況は反映します。未記録だった回数や出来事は、この更新以降から記録します。</p></main><script src="common/schema.js?v=100"></script><script src="common/robot-images.js?v=100"></script><script src="common/master.js?v=100"></script><script src="common/achievements.js?v=100"></script><script src="common/save.js?v=100"></script><script src="common/result.js?v=100"></script><script src="common/character-images.js?v=100"></script><script src="common/item-images.js?v=100"></script><script src="common/result-ui.js?v=100"></script><script>
(async()=>{try{await BoukenAchievements.init();let save=BoukenSave.load();BoukenAchievements.evaluate(save);save=BoukenSave.save(save);const master=await BoukenMaster.load('achievements'),m=BoukenAchievements.metrics(save),owned=new Set(save.achievementsUnlocked||[]),$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const bar=(n,t)=>`<div class="bar" role="progressbar" aria-label="達成進捗" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${t}"><i style="width:${Math.min(100,n/t*100)}%"></i></div>`;$('#summary').innerHTML=`<div class="panel"><div class="row"><strong>獲得した称号</strong><b>${owned.size} / 120</b></div>${bar(owned.size,120)}</div><div class="counts">${[['累計開拓',m.totalExplored||0,'マス'],['算数の正解',m.correctAnswers||0,'問'],['全域開拓',m.worldsAllExplored||0,'回'],['完全クリア',m.perfect,'回'],['仲間の登録',m.characters,'種類'],['コレクションの登録',m.items,'種類']].map(([name,n,unit])=>`<div class="panel muted">${name}<b>${Number(n).toLocaleString()} ${unit}</b></div>`).join('')}</div>`;
if(save.lastClearResult){const b=document.createElement('button');b.type='button';b.textContent='直近のぼうけんを見る';b.onclick=()=>BoukenResultUI.show(save.lastClearResult,'記録・実績にもどる');$('#summary').append(b);}
function render(){const q=$('#search').value.trim(),f=$('#filter').value;$('#list').innerHTML=[...new Set(master.map(x=>x.category))].map(cat=>{const rows=master.filter(x=>x.category===cat&&(!q||(x.name+x.conditionText).includes(q))&&(f==='all'||owned.has(x.id)===(f==='done')));return rows.length?`<h2>${esc(cat)}</h2>`+rows.map(x=>{const done=owned.has(x.id),n=done?x.target:Math.min(x.target,m[x.metric]||0);return `<article class="card ${done?'done':''}"><div class="row"><strong><span class="muted">${String(x.id).padStart(3,'0')}</span> ${esc(x.name)}</strong><span class="badge">${done?'🎉 獲得！':'未獲得'}</span></div><p class="muted">${esc(x.conditionText)}</p>${bar(n,x.target)}<div class="muted">${n.toLocaleString()} / ${x.target.toLocaleString()}</div></article>`}).join(''):''}).join('')||'<p class="muted">該当する称号がありません。</p>';}$('#search').oninput=render;$('#filter').onchange=render;render();$('#status').textContent='';}catch(e){document.getElementById('status').textContent='記録を開けません：'+e.message;}})();
</script></html>
