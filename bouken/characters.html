<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仲間図鑑｜算数ぼうけん</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f1;color:#233e30;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:18px}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#28744f;color:white}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #dba339;outline-offset:2px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:25px;margin:8px 0}h2{font-size:20px;margin:0}.eyebrow{font-size:11px;font-weight:bold;letter-spacing:.1em;color:#7a927d}.back,.light{background:#e4ece3;color:#345b40}.panel{background:white;border:1px solid #e2e9dd;border-radius:16px;padding:18px;margin:16px 0}.summary{display:flex;align-items:end;justify-content:space-between}.number{font-size:30px;font-weight:800}.muted{color:#718271;font-size:12px}.bar{height:8px;background:#eaf0e5;border-radius:8px;margin-top:14px;overflow:hidden}.bar div{height:100%;background:#62a176}.toolbar{display:flex;gap:8px;margin:14px 0}.toolbar input{min-width:0;flex:1;border:1px solid #ccd9c8;border-radius:10px;padding:12px;background:white}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{background:transparent;color:#6b7c6a;padding:9px 13px;border:1px solid #dce5d8}.tabs button.on{background:#28744f;color:white;border-color:#28744f}.list-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;font-size:12px;color:#6b7c6a}select{max-width:155px;padding:8px;border:1px solid #dce5d8;border-radius:8px;background:white;color:#36523d}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{position:relative;background:white;color:#263f2e;border:1px solid #dfe7da;border-radius:12px;padding:12px 6px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}.card:hover{border-color:#70a77e;box-shadow:0 3px 12px #23452a0e}.card .no{align-self:flex-start;font-size:10px;color:#899584;margin-left:4px}.sprite{display:inline-block;width:64px;height:64px;image-rendering:pixelated;flex:none}.card b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.badge{font-size:10px;color:#4b8558;background:#edf5e9;border-radius:5px;padding:3px 6px}.unknown{font-size:42px;color:#b7c1b0;height:64px;display:grid;place-items:center}.card.locked{background:#eef2e9;border-style:dashed}.card.locked b{color:#88947e}.more{display:block;width:100%;margin-top:16px;background:#e4ece3;color:#345b40}.mock-note{font-size:11px;color:#7a8c76;line-height:1.7;margin:22px 0}.empty{grid-column:1/-1;padding:50px;text-align:center;color:#74846c}dialog{border:0;border-radius:18px;padding:0;width:min(94vw,460px);max-height:88dvh;overflow:auto;color:#233e30;box-shadow:0 16px 60px #122e3340}dialog::backdrop{background:#10251f88}.dialog-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px;background:white;border-bottom:1px solid #edf1e8;z-index:2}.content{padding:20px}.hero{display:flex;align-items:center;gap:22px;background:#f1f6ec;border-radius:14px;padding:20px;margin-bottom:18px}.hero .sprite{transform:scale(1.45);margin:12px}.hero h2{margin:5px 0;font-size:20px}.flavor{font-size:14px;line-height:1.9}.skill{background:#f4f7f1;border-radius:10px;padding:12px;margin-top:10px}.skill b{font-size:13px}.skill p{font-size:12px;line-height:1.8;color:#62755c;margin:6px 0 0}.check{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e8eee2;font-size:14px}.check input{accent-color:#28744f;width:18px;height:18px}.sticky-bottom{position:sticky;bottom:0;background:white;padding:14px 20px;border-top:1px solid #e8eee2;display:flex;gap:9px}.sticky-bottom button{flex:1}@media(max-width:500px){main{padding:13px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.panel{padding:14px}.card{padding:9px 4px}.card b{font-size:11px}h1{font-size:23px}.tabs button{padding:8px 10px}.hero{padding:12px;gap:12px}}

.group-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;background:#edf3e9;border:1px solid #c5d4bf;border-radius:10px;padding:12px 14px;margin:26px 0 12px}.subgroup{border:1px solid #cbd8c5;border-radius:17px;padding:14px;margin:12px 0;background:#fff}.sub-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:12px}.complete-tag{color:#a35913;font-size:12px;font-weight:800;white-space:nowrap}.card{border:1px solid transparent;background:transparent;border-radius:12px;padding:7px 3px 5px;gap:1px;min-height:100px}.card .no{position:absolute;top:3px;left:2px;margin:0;z-index:1;font-size:9px;color:#7a8e72;background:#ffffff99;border-radius:3px;padding:1px}.card.locked{background:transparent;border-style:solid}.card.locked b{color:#718369}.silhouette{filter:brightness(0) invert(.65)}.card.highlight{background:#fff68b;border:2px solid #d9ae19;box-shadow:0 0 0 2px #fffbc8}.card b{font-size:10px;margin-top:3px}.grid{gap:4px;grid-template-columns:repeat(4,minmax(0,1fr))}.subgroup.complete{border-color:#c3b362;background:#fffef6}.group-anchor{scroll-margin-top:12px}.comp-link{display:block;width:100%;text-align:left;color:#345b40;background:#f1f5ec;margin:6px 0;font-size:13px}.comp-sub{padding:8px 12px;font-size:12px;color:#7b8d71}.empty{display:block;padding:35px 8px}.mock-note{margin-bottom:30px}@media(max-width:500px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.subgroup{padding:10px}.group-title{font-size:15px}.sub-title{font-size:13px}.complete-tag{font-size:11px}.tabs button{font-size:12px;padding:9px}.toolbar button{font-size:14px}}
.group-title{background:#285d41;color:white;border:0;font-weight:800;box-shadow:0 2px 4px #183b2115}.group-title .complete-tag{color:#ffe6a1}.back{background:#28744f;color:white;text-decoration:none;border-radius:10px;padding:11px 14px;white-space:nowrap;font-size:13px}.sprite canvas{width:64px;height:64px;image-rendering:pixelated}.toolbar input{width:0}.toolbar button{flex:none;padding:11px 12px}.condition-group{font-size:14px;margin-top:20px}.error{padding:14px;color:#963c23}.dialog-head button{flex:none}h3{margin:0}.search-hint{font-size:12px;color:#718271;margin:8px 0}
.comp-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px}.comp-row>span:first-child{flex:1;min-width:0}.comp-progress{display:block;margin-top:8px;height:8px}.comp-progress>span{display:block;height:100%;background:#62a176;border-radius:8px}
</style><link rel="stylesheet" href="common/screen-ui.css?v=89"><main><header><div><div class="eyebrow">SAN SUU BOUKEN</div><h1>仲間図鑑</h1></div><a class="back" id="home" href="home.html">ホームに戻る</a></header><section class="panel"><div class="summary"><div><div class="muted">見つけた仲間</div><span class="number" id="ownedCount">—</span><span class="muted"> / 927体</span></div><span class="badge" id="rate"></span></div><div class="bar"><div id="progress" style="width:0%"></div></div></section><div class="toolbar"><input id="search" disabled placeholder="なまえ・番号でさがす" aria-label="仲間を検索"><button id="filter" disabled>コンプ</button><button id="conditions" disabled>条件</button></div><div class="tabs" id="tabs"><button disabled data-loading-tab data-tab="all" class="on">すべて</button><button disabled data-loading-tab data-tab="complete">コンプリートした</button><button disabled data-loading-tab data-tab="incomplete">コンプリートしてない</button></div><p class="search-hint" id="activeConditions"></p><p id="pageStatus" class="page-status" role="status">仲間図鑑を読み込んでいます…</p><div id="groupList"></div></main><dialog id="detail"><div class="dialog-head"><h2>仲間のくわしいこと</h2><button class="light" onclick="this.closest('dialog').close()">閉じる</button></div><div id="detailBody" class="content"></div></dialog><dialog id="filters"><div class="dialog-head"><h2>コンプリート状況</h2><button class="light" onclick="this.closest('dialog').close()">閉じる</button></div><div id="completionList" class="content"></div></dialog><dialog id="conditionsDialog"><div class="dialog-head"><h2>表示の条件</h2><button class="light" id="closeConditions">閉じる</button></div><div class="content"><p class="muted">すべての条件に合う仲間を強調し、その小グループを表示します。</p><label class="check"><input id="recentCondition" type="checkbox">あたらしく入った仲間２０人</label><div id="skillChecks"></div></div><div class="sticky-bottom"><button class="light" id="clearConditions">すべて解除</button><button id="applyConditions">この条件で表示</button></div></dialog><p id="error" class="error" role="status"></p><script src="common/schema.js?v=89"></script><script src="common/save.js?v=89"></script><script src="common/master.js?v=89"></script><script src="common/character-images.js?v=89"></script><script>
(async()=>{try{
const [chars,skills,labels,messages]=await Promise.all([BoukenMaster.load('characters'),BoukenMaster.load('skills'),BoukenMaster.load('character_groups'),fetch('data/skill_messages.json?v=89').then(r=>{if(!r.ok)throw Error('スキル説明を取得できません');return r.json()})]);
const groupNames=labels.groups,subNames=labels.subgroups;
const $=id=>document.getElementById(id),save=BoukenSave.load(),owned=new Set(chars.filter(c=>Number(save.characters?.[c.id])>0).map(c=>c.id)),names=new Map(skills.map(s=>[s.id,s.name]));let tab='all',selected=[],recent=false;
const known=new Set((save.characterJoinOrder||[]).map(Number)),order=[...[...owned].filter(id=>!known.has(id)).sort((a,b)=>a-b),...(save.characterJoinOrder||[]).map(Number).filter(id=>owned.has(id))],latest=new Set(order.slice(-20));
await BoukenCharacterImages.init();
const groups=[...new Set(chars.map(c=>c.groupId))].map(id=>({id,name:groupNames[id],subs:[...new Set(chars.filter(c=>c.groupId===id).map(c=>c.subgroupId))].map(sid=>({id:sid,name:subNames[sid],members:chars.filter(c=>c.groupId===id&&c.subgroupId===sid)}))}));
const complete=s=>s.members.every(c=>owned.has(c.id)),bigComplete=g=>g.subs.every(complete);
function sprite(c){const e=document.createElement('span');e.className='sprite'+(owned.has(c.id)?'':' silhouette');e.append(BoukenCharacterImages.picture(c.id,64));return e}
function matches(c,q){return (!q||String(c.id).includes(q)||c.name.toLowerCase().includes(q))&&(!recent||latest.has(c.id))&&selected.every(id=>c.skills.some(s=>s.id===id))}
function tag(){const e=document.createElement('span');e.className='complete-tag';e.textContent='🎉 コンプ！';return e}
function render(){const q=$('search').value.trim().toLowerCase(),list=$('groupList');$('activeConditions').textContent=[...(recent?['あたらしく入った仲間２０人']:[]),...selected.map(id=>names.get(id))].join(' ＋ ');$('conditions').textContent='条件'+(selected.length||recent?' ●':'');list.replaceChildren();let visible=false;for(const g of groups){const shown=g.subs.filter(s=>(tab==='all'||(tab==='complete'?complete(s):!complete(s)))&&s.members.some(c=>matches(c,q)));if(!shown.length)continue;visible=true;const section=document.createElement('section');const heading=document.createElement('h2');heading.className='group-title';const name=document.createElement('span');name.textContent=g.name;heading.append(name);if(bigComplete(g))heading.append(tag());section.append(heading);for(const sub of shown){const box=document.createElement('section');box.className='subgroup group-anchor'+(complete(sub)?' complete':'');box.id='sub-'+sub.id;const h=document.createElement('h3');h.className='sub-title';const title=document.createElement('span');title.textContent=sub.name;h.append(title);if(complete(sub))h.append(tag());box.append(h);const grid=document.createElement('div');grid.className='grid';for(const c of sub.members){const ok=owned.has(c.id),button=document.createElement('button');button.className='card'+(ok?'':' locked')+((q||recent||selected.length)&&matches(c,q)?' highlight':'');button.setAttribute('aria-label',`No.${c.id} ${c.name} ${ok?'加入済み':'未獲得'}`);const no=document.createElement('span');no.className='no';no.textContent='No.'+String(c.id).padStart(3,'0');const label=document.createElement('b');label.textContent=c.name;button.append(no,sprite(c),label);button.onclick=()=>details(c);grid.append(button)}box.append(grid);section.append(box)}list.append(section)}if(!visible){const p=document.createElement('p');p.className='empty';p.textContent='この条件のグループはありません';list.append(p)}}
function details(c){const body=$('detailBody');body.replaceChildren();const hero=document.createElement('div');hero.className='hero';hero.append(sprite(c));const head=document.createElement('div');const no=document.createElement('small');no.textContent='No.'+String(c.id).padStart(3,'0');const title=document.createElement('h2');title.textContent=c.name;const place=document.createElement('div');place.className='muted';place.textContent=owned.has(c.id)?'いばしょ：'+c.location:'まだ仲間になっていません';head.append(no,title,place);hero.append(head);body.append(hero);if(owned.has(c.id)){const desc=document.createElement('p');desc.className='flavor';desc.textContent=c.description;body.append(desc);for(const s of c.skills){const row=document.createElement('div');row.className='skill';const title=document.createElement('b');title.textContent=`${s.id}　${names.get(s.id)}　Lv${s.level}`;const p=document.createElement('p');p.textContent=messages[s.id]||'';row.append(title,p);body.append(row)}}$('detail').showModal()}
$('tabs').onclick=e=>{if(!e.target.dataset.tab)return;tab=e.target.dataset.tab;for(const b of $('tabs').children)b.classList.toggle('on',b.dataset.tab===tab);render()};$('search').oninput=render;
$('filter').onclick=()=>{const list=$('completionList');list.replaceChildren();for(const g of groups){const h=document.createElement('h3');h.className='sub-title';h.textContent=g.name;if(bigComplete(g))h.append(tag());list.append(h);for(const s of g.subs){const button=document.createElement('button');button.className='comp-link';const found=s.members.filter(c=>owned.has(c.id)).length,total=s.members.length;const title=document.createElement('span');title.className='comp-row';const label=document.createElement('span');label.textContent=s.name;const amount=document.createElement('span');amount.className='muted';amount.textContent=found+'/'+total+'体';title.append(label,amount);if(complete(s))title.append(tag());const bar=document.createElement('span');bar.className='bar comp-progress';bar.setAttribute('role','progressbar');bar.setAttribute('aria-label',s.name+'の加入状況');bar.setAttribute('aria-valuemin','0');bar.setAttribute('aria-valuemax',String(total));bar.setAttribute('aria-valuenow',String(found));bar.setAttribute('aria-valuetext',found+'/'+total+'体');const fill=document.createElement('span');fill.style.width=(found/total*100)+'%';bar.append(fill);button.append(title,bar);button.onclick=()=>{tab='all';selected=[];recent=false;$('search').value='';for(const b of $('tabs').children)b.classList.toggle('on',b.dataset.tab===tab);render();$('filters').close();document.getElementById('sub-'+s.id).scrollIntoView({behavior:'smooth',block:'start'})};list.append(button)}}$('filters').showModal()};for(const prefix of [...new Set(skills.map(s=>s.id[0]))]){const h=document.createElement('h3');h.className='condition-group';h.textContent=prefix+'系';$('skillChecks').append(h);for(const skill of skills.filter(s=>s.id.startsWith(prefix))){const label=document.createElement('label');label.className='check';const input=document.createElement('input');input.type='checkbox';input.value=skill.id;const text=document.createElement('span');text.textContent=skill.id+' '+skill.name+(skill.id==='D04'?'（準備中）':'');label.append(input,text);$('skillChecks').append(label)}}
$('conditions').onclick=()=>{$('recentCondition').checked=recent;document.querySelectorAll('#skillChecks input').forEach(e=>e.checked=selected.includes(e.value));$('conditionsDialog').showModal()};$('closeConditions').onclick=()=>$('conditionsDialog').close();$('clearConditions').onclick=()=>{$('recentCondition').checked=false;document.querySelectorAll('#skillChecks input').forEach(e=>e.checked=false)};$('applyConditions').onclick=()=>{selected=[...document.querySelectorAll('#skillChecks input:checked')].map(e=>e.value);recent=$('recentCondition').checked;$('conditionsDialog').close();render()};
$('ownedCount').textContent=owned.size;$('rate').textContent=Math.floor(owned.size/927*100)+'% 発見';$('progress').style.width=owned.size/927*100+'%';render();$('pageStatus').textContent='';for(const e of document.querySelectorAll('#search,#filter,#conditions,[data-loading-tab]'))e.disabled=false;
}catch(e){document.getElementById('pageStatus').textContent='';document.getElementById('error').textContent='図鑑を読み込めませんでした：'+e.message;console.error(e)}})();
</script></html>
