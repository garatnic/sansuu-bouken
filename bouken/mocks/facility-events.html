<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>施設イベント演出モック | 算数ぼうけん</title>
<style>
:root{font-family:system-ui,sans-serif;color:#243e30;background:#eef3eb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #ddaa35;outline-offset:3px}[hidden]{display:none!important}.workbench{max-width:1160px;margin:auto;padding:26px 24px 36px}.mast{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{color:#71816c;font-size:11px;font-weight:800;letter-spacing:.18em;margin:0 0 6px}.mast h1{font-size:23px;margin:0;letter-spacing:.02em}.prototype{border:1px solid #c9d5c5;border-radius:99px;padding:7px 12px;white-space:nowrap;font-size:12px;font-weight:700}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px}.controls{padding:22px;background:#fffdf6;border:1px solid #d9dfcf;border-radius:18px;align-self:start}.controls h2{font-size:15px;margin:0 0 14px}.scenarios{display:grid;gap:8px}.scenario{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid transparent;border-radius:10px;text-align:left;padding:12px;color:#52634f;font-size:14px}.scenario span{width:22px;font-size:17px}.scenario[aria-pressed=true]{background:#e6efdf;border-color:#b8cba8;color:#234c32;font-weight:750}.divider{border:0;border-top:1px solid #e1e6d9;margin:21px 0}.controls p{font-size:12px;line-height:1.8;color:#73806c;margin:12px 0 0}.controls label{display:block;font-size:12px;margin-bottom:8px;font-weight:700}.controls select{width:100%;padding:10px;background:white;border:1px solid #c8d3bf;border-radius:9px;color:#294c35}.replay{width:100%;border:1px solid #b9c9ae;border-radius:10px;padding:11px;background:#fffdf6;color:#31583c;margin-top:12px}.stage{position:relative;min-height:720px;isolation:isolate;overflow:hidden;border-radius:22px;background:#163c2b;box-shadow:0 12px 40px #173e2815}.game-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;color:#f1f8e7}.game-header strong{font-size:19px}.home{font-size:12px;color:#d6e7d5;border:1px solid #6e8a71;border-radius:8px;padding:8px 12px;background:transparent}.map-wrap{padding:0 24px}.game-status{font-size:12px;color:#b5cdb0;margin:0 0 12px}.map{display:grid;grid-template-columns:repeat(5,1fr);border:4px solid #4b6942;gap:1px;background:#4b6942;aspect-ratio:1.1}.tile{background-image:url('../assets/sheets/field_tiles.png');background-size:700% 100%;image-rendering:pixelated;position:relative;min-width:0}.tile.fog{background:#162c2b}.tile.frontier{outline:2px solid #e0c342;outline-offset:-3px}.map .facility{position:absolute;width:100%;height:100%;background:url('../assets/sheets/event_tiles.png') left/800% 100%;image-rendering:pixelated}.tile.player::after{content:'●';position:absolute;inset:0;display:grid;place-items:center;color:#f0edd0;text-shadow:0 2px 5px #000;font-size:26px}.progress{height:5px;background:#3f6045;border-radius:9px;margin-top:12px;overflow:hidden}.progress::after{content:'';display:block;width:58%;height:100%;background:#97b55b}.shade{position:absolute;inset:0;z-index:1;background:#0b241e99;backdrop-filter:blur(2px)}.card-wrap{position:absolute;inset:0;z-index:2;display:grid;align-items:center;justify-items:center;padding:24px;pointer-events:none}.event-card{pointer-events:auto;position:relative;width:min(100%,440px);max-height:calc(100% - 4px);overflow:auto;background:#fffdf2;border:2px solid #d5bd77;border-radius:22px;box-shadow:0 18px 70px #0006;color:#263d2a}.event-card.new{border-color:#dfbc4c;background:linear-gradient(160deg,#fffdf5 30%,#fff2c5)}.event-card.fail{border-color:#bac7b2;background:#f5f7ef}.event-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 18px 0}.ribbon{font-size:12px;font-weight:800;color:#7b5b14;background:#f5e5a3;border-radius:99px;padding:6px 12px}.fail .ribbon{background:#e0e7d9;color:#63715c}.close{width:34px;height:34px;flex:none;border:1px solid #d9dfcc;border-radius:50%;background:#fffdf2;color:#64715b;font-size:22px;line-height:1}.event-content{text-align:center;padding:8px 27px 23px}.event-content h2{margin:12px 0 5px;font-size:26px;line-height:1.45;letter-spacing:.02em}.subtitle{font-size:13px;color:#7a815f;margin:0 0 12px}.portrait-zone{position:relative;display:grid;place-items:center;height:192px;margin:8px 0 14px;isolation:isolate}.medallion{display:grid;place-items:center;width:168px;height:168px;border-radius:50%;background:radial-gradient(circle,#fffce4 0 48%,#f7e5a1 70%,#e5cd7c 71%,#f8ebbd 73%,#fff6d1 75%);box-shadow:0 0 0 1px #e4d49b,0 0 32px #f5cf5c55}.new .portrait-zone{height:170px}.new .medallion::before{content:'';position:absolute;z-index:-1;width:218px;height:218px;background:repeating-conic-gradient(from 10deg,#e6b82e24 0 10deg,transparent 10deg 29deg);border-radius:50%;mask-image:radial-gradient(circle,#000 35%,transparent 70%)}.portrait{width:148px;height:148px;display:grid;place-items:center;font-size:48px}.portrait canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.facility-art{width:128px;height:128px;image-rendering:pixelated;background:url('../assets/sheets/event_tiles.png') left/800% 100%}.spark{position:absolute;color:#dba32b;font-size:23px;line-height:1;left:calc(50% - 106px);top:35px}.spark.s2{left:calc(50% + 83px);top:106px;font-size:17px}.spark.s3{left:calc(50% + 65px);top:12px;font-size:13px}.new .spark{animation:twinkle 1.5s ease-in-out 2 alternate}.name{display:block;font-size:24px;font-weight:850;line-height:1.5;margin:0 0 5px}.message{font-size:16px;line-height:1.8;margin:10px 0 17px;white-space:pre-line}.skill{display:flex;align-items:center;justify-content:center;gap:8px;background:#eef3dd;border:1px solid #d8e0be;border-radius:10px;padding:10px;margin-top:14px;font-size:14px;font-weight:750}.skill small{color:#748153;font-weight:500}.owned{display:inline-block;border:1px solid #d8ddcc;border-radius:99px;font-size:13px;color:#6d795d;padding:6px 14px;margin:9px 0}.main-button{display:block;width:100%;border:0;border-radius:12px;background:#28704b;color:#fff;padding:14px 10px;min-height:50px;font-size:16px;font-weight:750;box-shadow:0 3px 0 #165137}.new .main-button{background:#2c784d}.helper{font-size:11px;color:#8a9279;margin:12px 0 0;line-height:1.7}.event-card.duplicate .portrait-zone{height:145px}.duplicate .medallion{width:136px;height:136px;background:#f1f4df;box-shadow:none}.duplicate .portrait{width:120px;height:120px}.duplicate .event-content h2{font-size:23px}.duplicate .name{font-size:21px}.duplicate .message{font-size:15px}.fail .portrait{filter:grayscale(1);opacity:.62}.fail .medallion{background:#e6ebdf;box-shadow:none}.fail .portrait-zone{height:156px}.fail .medallion{width:148px;height:148px}.fail .portrait{width:128px;height:128px}.failure-mark{position:absolute;right:calc(50% - 80px);bottom:15px;width:36px;height:36px;background:#83917a;color:white;border:3px solid #f5f7ef;border-radius:50%;display:grid;place-items:center;font-size:20px}.event-card.enter{animation:appear .28s ease-out}.event-card.duplicate.enter{animation-duration:.14s}.resume-state{position:absolute;inset:0;z-index:3;display:grid;place-content:center;text-align:center;color:#f5f9e9;padding:24px;background:#173e2bcd}.resume-state h2{font-size:22px}.resume-state button{background:#fff7d5;color:#2a5135;border:0;border-radius:12px;padding:14px 24px;font-weight:700}.caption{font-size:12px;color:#74826a;line-height:1.8;margin:14px 5px 0}.caption strong{color:#4b6245}.stage-label{position:absolute;left:20px;bottom:14px;color:#b5c6ac;font-size:10px;letter-spacing:.1em}.screen-mode{font-size:10px;font-weight:700;letter-spacing:.12em;color:#a7bd9f}.phone .stage{max-width:390px;margin:auto;min-height:690px}.phone .game-header{padding:18px 15px}.phone .card-wrap{padding:16px}.phone .event-content{padding:8px 19px 21px}.phone .event-content h2{font-size:23px}.phone .layout{grid-template-columns:250px minmax(0,1fr)}
@keyframes appear{from{opacity:0;transform:translateY(9px) scale(.98)}to{opacity:1;transform:none}}@keyframes twinkle{from{opacity:.35;transform:scale(.85)}to{opacity:1;transform:scale(1.1)}}@media(prefers-reduced-motion:reduce){.event-card.enter,.new .spark{animation:none}}@media(max-width:760px){.workbench{padding:17px 12px 26px}.mast{margin-bottom:16px}.mast h1{font-size:19px}.prototype{font-size:10px;padding:6px 9px}.layout,.phone .layout{grid-template-columns:1fr;gap:14px}.controls{padding:14px}.controls h2{font-size:13px;margin-bottom:9px}.scenarios{grid-template-columns:repeat(3,1fr);gap:5px}.scenario{padding:9px 5px;display:block;text-align:center;font-size:11px;line-height:1.5}.scenario span{display:block;width:auto;margin-bottom:3px}.divider{margin:12px 0}.controls p{margin-top:8px}.display-control{display:none}.controls .replay{margin-top:8px;padding:8px}.stage,.phone .stage{min-height:670px;width:100%;max-width:430px;margin:auto}.card-wrap{padding:15px}.event-content{padding:8px 20px 22px}.event-content h2{font-size:23px}.game-header{padding:18px 15px}.caption{max-width:430px;margin:12px auto 0}.portrait-zone{height:177px}.medallion{width:158px;height:158px}.portrait{width:140px;height:140px}}
</style></head><body>
<main class="workbench"><header class="mast"><div><p class="eyebrow">SANSUU BOUKEN / EVENT DESIGN</p><h1>施設イベントの演出モック</h1></div><span class="prototype">見た目の確認用</span></header><div class="layout"><aside class="controls"><h2>表示する場面</h2><div class="scenarios" aria-label="場面の切り替え"></div><hr class="divider"><div class="display-control"><label for="widthMode">プレビューの幅</label><select id="widthMode"><option value="wide">広い画面</option><option value="phone">スマホ相当・390px</option></select></div><button class="replay" id="replay" type="button">↻ 演出をもう一度</button><p>場面を選ぶと、右の画面が切り替わります。セーブや抽選は行いません。</p></aside><section><div class="stage" aria-label="ゲーム画面のプレビュー"><header class="game-header"><strong>ぼうけんのせかい</strong><span class="screen-mode">PREVIEW</span></header><div class="map-wrap"><p class="game-status">5×5 ／ 開拓 14/24 ／ 施設 0/1</p><div class="map" aria-hidden="true"></div><div class="progress"></div></div><div class="shade"></div><div class="card-wrap"><section id="event" class="event-card" aria-labelledby="eventTitle" aria-live="polite"></section></div><div class="resume-state" id="resume" hidden><h2>ぼうけんを つづけよう！</h2><p>ここから通常のマップ操作へ戻ります。</p><button type="button" id="reopen">もう一度ひらく</button></div><span class="stage-label">施設イベント / 演出プレビュー</span></div><p class="caption" id="caption"></p></section></div></main>
<script src="../common/character-images.js?v=67"></script><script src="../common/item-images.js?v=67"></script>
<script>
(()=>{
 const scenes=[
 {id:'visit',icon:'⌂',label:'施設訪問',tag:'町に とうちゃく！',title:'町を見つけた！',subtitle:'まだ知らない出会いが、ここに。',name:'小さな町',message:'だれかが こちらを見ています。\n声をかけてみよう！',button:'声をかける',kind:'visit',note:'施設の画像と短い文章で、訪問したことを伝えます。ボタンを押すと、獲得結果の見た目へ進みます。'},
 {id:'newCharacter',icon:'✦',label:'仲間・初めて',tag:'はじめての仲間！',title:'仲間になったよ！',subtitle:'新しい出会いを、冒険の力に。',name:'グリーンゴブ',message:'次の冒険が 楽しみだね！',button:'ぼうけんをつづける',kind:'new',type:'companion',skill:true,note:'初めての仲間は大きな画像・金色の光彩・短いきらめきでお祝い。スキルも一言で紹介します。待ち時間は設けません。'},
 {id:'duplicateCharacter',icon:'↻',label:'仲間・2回目',tag:'また会えたね！',title:'また仲間になったよ！',name:'グリーンゴブ',message:'同じ仲間が もう1人！',button:'ぼうけんをつづける',kind:'duplicate',type:'companion',owned:'持っている数　1 → 2',note:'重複獲得は小さめの画像と短い表示に。派手なきらめきは省き、増えた数をすぐに確認できます。'},
 {id:'newItem',icon:'◇',label:'コレクション・初めて',tag:'はじめてのお宝！',title:'お宝を見つけた！',subtitle:'はくぶつかんに、新しい発見。',name:'赤竜の指輪',message:'コレクションが ふえたよ！',button:'ぼうけんをつづける',kind:'new',type:'collection',note:'初獲得のコレクションも金色でお祝い。獲得したものの名前と画像を中心にし、博物館へ強制移動はしません。'},
 {id:'duplicateItem',icon:'↻',label:'コレクション・2回目',tag:'また見つけた！',title:'お宝を見つけた！',name:'赤竜の指輪',message:'同じコレクションを\nもう1つ見つけたよ！',button:'ぼうけんをつづける',kind:'duplicate',type:'collection',owned:'持っている数　1 → 2',note:'コレクションの重複も短い表示で統一。獲得したことと、所持数の増加がひと目でわかる見た目です。'},
 {id:'failure',icon:'…',label:'失敗',tag:'今回は、ざんねん…',title:'仲間にならなかった',name:'グリーンゴブ',message:'声をかけたけど、\nいっしょには 来てくれなかった。',button:'ぼうけんをつづける',kind:'fail',type:'companion',note:'失敗は画像をグレーにして、成功と区別。獲得したと誤解する表現やお祝いの演出は使いません。'}
 ];
 let current='visit';const card=document.getElementById('event'),tabs=document.querySelector('.scenarios'),map=document.querySelector('.map');
 for(let i=0;i<25;i++){const tile=document.createElement('div');tile.className='tile'+(i>14?' fog':'')+(i>=15&&i<=19?' frontier':'')+(i===12?' player':'');tile.style.backgroundPosition=([0,0,1,0,2,0,4][(i*11+Math.floor(i/5))%7]/6*100)+'% 0';if(i===7){const f=document.createElement('span');f.className='facility';tile.append(f);}map.append(tile);}
 for(const s of scenes){const b=document.createElement('button');b.type='button';b.className='scenario';b.dataset.scene=s.id;b.setAttribute('aria-pressed','false');const icon=document.createElement('span');icon.textContent=s.icon;icon.setAttribute('aria-hidden','true');b.append(icon,document.createTextNode(s.label));b.onclick=()=>show(s.id);tabs.append(b);}
 function picture(type){const holder=document.createElement('div');holder.className='portrait';holder.setAttribute('aria-hidden','true');holder.textContent=type==='collection'?'◇':'…';const api=type==='collection'?BoukenItemImages:BoukenCharacterImages;api.init().then(()=>{if(holder.isConnected)holder.replaceChildren(api.picture(type==='collection'?1:298));});return holder;}
 function show(id){current=id;const s=scenes.find(s=>s.id===id);document.getElementById('resume').hidden=true;document.querySelector('.shade').hidden=false;card.hidden=false;card.className='event-card '+s.kind;card.replaceChildren();
  for(const b of tabs.children)b.setAttribute('aria-pressed',String(b.dataset.scene===id));
  const top=document.createElement('div');top.className='event-top';const tag=document.createElement('span');tag.className='ribbon';tag.textContent=s.tag;const close=document.createElement('button');close.type='button';close.className='close';close.textContent='×';close.setAttribute('aria-label','イベントを閉じる');close.onclick=finish;top.append(tag,close);
  const body=document.createElement('div');body.className='event-content';const h=document.createElement('h2');h.id='eventTitle';h.textContent=s.title;body.append(h);if(s.subtitle){const sub=document.createElement('p');sub.className='subtitle';sub.textContent=s.subtitle;body.append(sub);}
  const zone=document.createElement('div');zone.className='portrait-zone';const medallion=document.createElement('div');medallion.className='medallion';if(s.kind==='visit'){const art=document.createElement('div');art.className='facility-art';art.setAttribute('aria-hidden','true');medallion.append(art);}else medallion.append(picture(s.type));zone.append(medallion);
  if(s.kind==='new'){for(let i=0;i<3;i++){const spark=document.createElement('span');spark.className='spark'+(i?' s'+(i+1):'');spark.textContent='✦';spark.setAttribute('aria-hidden','true');zone.append(spark);}}
  if(s.kind==='fail'){const mark=document.createElement('span');mark.className='failure-mark';mark.textContent='…';mark.setAttribute('aria-hidden','true');zone.append(mark);}body.append(zone);
  const name=document.createElement('strong');name.className='name';name.textContent=s.name;body.append(name);if(s.owned){const owned=document.createElement('div');owned.className='owned';owned.textContent=s.owned;body.append(owned);}
  if(s.skill){const skill=document.createElement('div');skill.className='skill';skill.textContent='◉ 遠見 Lv3';const small=document.createElement('small');small.textContent='土地をのぞけるよ';skill.append(small);body.append(skill);}
  const message=document.createElement('p');message.className='message';message.textContent=s.message;body.append(message);const button=document.createElement('button');button.type='button';button.className='main-button';button.textContent=s.button;button.onclick=()=>s.kind==='visit'?show('newCharacter'):finish();body.append(button);card.append(top,body);void card.offsetWidth;card.classList.add('enter');document.getElementById('caption').textContent=s.note;
 }
 function finish(){card.hidden=true;document.querySelector('.shade').hidden=true;document.getElementById('resume').hidden=false;document.getElementById('reopen').focus();}
 document.getElementById('replay').onclick=()=>show(current);document.getElementById('reopen').onclick=()=>show(current);document.getElementById('widthMode').onchange=e=>document.body.classList.toggle('phone',e.target.value==='phone');document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!card.hidden)finish();});show(current);
})();
</script></body></html>
