<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>冒険ワールドに出発 | 算数ぼうけん</title><style>body{font-family:system-ui,sans-serif;background:#f5f8f4;color:#1e3327;margin:0;padding:14px;max-width:850px;margin-inline:auto}h1{font-size:1.5rem}button,.button{display:block;box-sizing:border-box;width:100%;padding:14px;margin:12px 0;border:0;border-radius:12px;background:#25704d;color:white;font-size:1rem;text-align:center;text-decoration:none;cursor:pointer}.muted{color:#53675b}.panel{background:white;border-radius:14px;padding:15px;margin:12px 0}select{font-size:1.1rem;padding:12px;width:100%}.error{color:#a11}.map{display:grid;gap:1px;width:max-content;background:#344b45;padding:2px}.cell{width:25px;height:25px;display:grid;place-items:center;font-size:16px;box-sizing:border-box;position:relative}.cell.start{outline:2px solid #fce15c;outline-offset:-2px}.scroll{overflow:auto;max-width:100%;border-radius:8px}.legend{font-size:.9rem;line-height:1.9}</style><style>.page-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}.page-heading h1{margin:0;min-width:0}.page-back{display:inline-block;flex:none;width:auto!important;margin:0!important;padding:9px 11px!important;font-size:.82rem!important;border-radius:9px!important;background:#25704d;color:#fff;text-decoration:none;white-space:nowrap}</style><link rel="stylesheet" href="common/screen-ui.css?v=77"><link rel="stylesheet" href="common/world-select.css?v=77"><link rel="stylesheet" href="common/tutorial.css?v=77"></head><body><section class="world-select-hero" aria-label="冒険の地図"><img width="412" height="308" src="assets/sheets/worldselect.jpg" alt="机いっぱいに広がる、次の冒険へ向かう地図"><header class="page-heading"><h1>冒険ワールドに出発</h1><a class="page-back" href="home.html">ホームに戻る</a></header></section>
<main class="departure-controls"><div class="new-departure"><label for="size">ワールドの大きさ</label><select id="size" disabled></select><button id="create" disabled>新しいワールドへ出発！</button></div><button id="resumeWorld" type="button" aria-describedby="previousGuide" disabled>前のワールドに出発</button><p id="previousGuide" class="sr-only">セーブデータを確認しています…</p><p id="guide" class="departure-guide" hidden>ワールドを生成します。</p><p id="status" role="status">出発の準備をしています…</p><p id="resumeStatus" class="error" role="status"></p></main><script src="common/schema.js?v=77"></script><script src="common/achievements.js?v=77"></script><script src="common/save.js?v=77"></script><script src="common/tutorial.js?v=77"></script><script src="common/result.js?v=77"></script><script src="common/progress.js?v=77"></script><script src="common/master.js?v=77"></script><script src="common/worldgen.js?v=77"></script><script src="common/party.js?v=77"></script><script src="common/explore.js?v=77"></script><script src="common/collection.js?v=77"></script><script src="common/buffs.js?v=77"></script><script>
(async()=>{const status=document.getElementById('status'),select=document.getElementById('size'),button=document.getElementById('create');try{await BoukenAchievements.init();const save=BoukenSave.load();const resume=document.getElementById('resumeWorld'),previousGuide=document.getElementById('previousGuide');
if(save.world){previousGuide.textContent=save.world.width+'×'+save.world.height+'のワールドを再開できます。';resume.disabled=false;}else{previousGuide.textContent='まだ前のワールドがありません。新しいワールドへ出発しよう！';}
resume.onclick=()=>{resume.disabled=true;try{const current=BoukenSave.load();if(!current.world)throw Error('再開するワールドがありません');BoukenAchievements.event(current,'resumed');BoukenSave.save(current);location.href='world.html';}catch(err){document.getElementById('resumeStatus').textContent='再開できませんでした：'+err.message;resume.disabled=false;}};
if(BoukenProgress.tutorialLocked(save)){select.innerHTML='<option>'+Number(save.world.width||5)+'×'+Number(save.world.height||5)+'（ぼうけん中）</option>';document.getElementById('guide').hidden=false;document.getElementById('guide').textContent='チュートリアルのすべてのマスを開拓してから、次の世界へ進もう。「前のワールドに出発」でつづきを遊べます。';status.textContent='';return;}if(save.world){document.getElementById('guide').hidden=false;document.getElementById('guide').textContent='中断中のワールドがあります。新しい世界を生成すると、以前のワールドは置き換わります（仲間・コレクション・記録は保持）。「前のワールドに出発」でつづきを再開できます。';}const first=(save.worldsStarted||0)<2;const counts=await BoukenMaster.load('world_facility_counts');for(const c of counts.filter(c=>first?c.width===5:c.width!==5)){const o=document.createElement('option');o.value=c.width;o.textContent=c.width+'×'+c.height+'（施設 '+c.facilityCount+'）';select.append(o);}if(first)document.getElementById('guide').textContent='チュートリアル '+((save.worldsStarted||0)+1)+'：5×5の世界です。';button.addEventListener('click',async()=>{button.disabled=true;resume.disabled=true;select.disabled=true;try{const current=BoukenSave.load();if(BoukenProgress.tutorialLocked(current))throw Error('チュートリアルのつづきを開いてね。');if(!await BoukenTutorial.confirmDeparture(current))return;const [terrains,facilities,counts]=await Promise.all(['terrains','facilities','world_facility_counts'].map(n=>BoukenMaster.load(n)));const n=Number(select.value);if(!n)throw Error('サイズを選択してください');const characters=await BoukenMaster.load('characters');
const owned=characters.filter(c=>Number(current.characters?.[c.id]||0)>0).map(c=>c.id);
const departureNumber=(current.worldsStarted||0)+1;const party=departureNumber===1?[]:BoukenParty.normalize(current.party,owned,BoukenParty.capacity(owned.length));
const partyBuffs=BoukenParty.buffs(party,new Map(characters.map(c=>[c.id,c])));
BoukenCollection.configure(await BoukenMaster.load('collection_items'),await BoukenMaster.load('collection_rewards'));
const world=BoukenWorldGen.generate(n,n,terrains,facilities,counts,partyBuffs);
world.departureNumber=departureNumber;world.partySnapshot=[...party];
world.partyBuffsSnapshot=partyBuffs;if(window.BoukenResult)BoukenResult.start(world);const initialBase=BoukenBuffs.initial(world);const cumulativeBefore=current.records?.totalExplored||0;const initialA03=BoukenBuffs.threshold(world,world.lastInitialOpenedIndex??world.startIndex,cumulativeBefore,cumulativeBefore+initialBase);const afterA11=cumulativeBefore+initialBase+initialA03.opened;const museumOpened=BoukenCollection.initial(world,BoukenCollection.stages(current)[1]);const museumA03=museumOpened?BoukenBuffs.threshold(world,world.lastInitialOpenedIndex??world.startIndex,afterA11,afterA11+museumOpened):{opened:0,indices:[]};const initialOpened=initialBase+initialA03.opened+museumOpened+museumA03.opened;BoukenBuffs.initialVision(world);BoukenBuffs.revealNear(world);BoukenBuffs.thresholdVision(world,0,initialOpened);world.b01VisionInitialized=true;world.lastExploredIndex=museumA03.indices.at(-1)??(museumOpened?world.lastInitialOpenedIndex:initialA03.indices.at(-1))??world.lastInitialOpenedIndex??world.startIndex;current.records=current.records||{};current.records.totalExplored=(current.records.totalExplored||0)+initialOpened;if(world.adventureStats)world.adventureStats.automaticOpened=initialOpened;BoukenAchievements.departure(current,world,initialOpened);current.world=world;current.worldsStarted=departureNumber;BoukenProgress.recordMilestones(current,world,undefined,characters);if(window.BoukenResult)BoukenResult.finish(current,world);BoukenSave.save(current);location.href='world.html';}catch(e){status.textContent=e.message;status.className='error';button.disabled=false;select.disabled=false;resume.disabled=!save.world;}finally{if(location.href.indexOf('world.html')<0){button.disabled=false;select.disabled=false;resume.disabled=!save.world;}}});button.disabled=false;select.disabled=false;status.textContent='';}catch(e){status.textContent=e.message;status.className='error';button.disabled=true;}})();
</script></body></html>
