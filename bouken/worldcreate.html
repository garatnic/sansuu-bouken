<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ワールド生成 | 算数ぼうけん</title><style>body{font-family:system-ui,sans-serif;background:#f5f8f4;color:#1e3327;margin:0;padding:14px;max-width:850px;margin-inline:auto}h1{font-size:1.5rem}button,.button{display:block;box-sizing:border-box;width:100%;padding:14px;margin:12px 0;border:0;border-radius:12px;background:#25704d;color:white;font-size:1rem;text-align:center;text-decoration:none;cursor:pointer}.muted{color:#53675b}.panel{background:white;border-radius:14px;padding:15px;margin:12px 0}select{font-size:1.1rem;padding:12px;width:100%}.error{color:#a11}.map{display:grid;gap:1px;width:max-content;background:#344b45;padding:2px}.cell{width:25px;height:25px;display:grid;place-items:center;font-size:16px;box-sizing:border-box;position:relative}.cell.start{outline:2px solid #fce15c;outline-offset:-2px}.scroll{overflow:auto;max-width:100%;border-radius:8px}.legend{font-size:.9rem;line-height:1.9}</style></head><body><h1>新しいワールドへ出発</h1><div class="panel"><p id="guide">ワールドを生成します。</p><label for="size">ワールドの大きさ</label><select id="size"></select><button id="create">この世界へ出発！</button><p id="status" role="status"></p></div><a class="button" href="home.html">ホームにもどる</a><script src="common/schema.js?v=25"></script><script src="common/save.js?v=25"></script><script src="common/master.js?v=25"></script><script src="common/worldgen.js?v=25"></script><script src="common/party.js?v=25"></script><script src="common/explore.js?v=25"></script><script src="common/buffs.js?v=25"></script><script>
(async()=>{const status=document.getElementById('status'),select=document.getElementById('size'),button=document.getElementById('create');try{const save=BoukenSave.load();if(save.world){document.getElementById('guide').textContent='中断中のワールドがあります。新しい世界を生成すると、以前のワールドは置き換わります（仲間・収集品・記録は保持）。ホームへ戻れば以前の世界を再開できます。';}const first=(save.worldsStarted||0)<2;const counts=await BoukenMaster.load('world_facility_counts');for(const c of counts.filter(c=>first?c.width===5:c.width!==5)){const o=document.createElement('option');o.value=c.width;o.textContent=c.width+'×'+c.height+'（施設 '+c.facilityCount+'）';select.append(o);}if(first)document.getElementById('guide').textContent='チュートリアル '+((save.worldsStarted||0)+1)+'：5×5の世界です。';button.addEventListener('click',async()=>{button.disabled=true;try{const current=BoukenSave.load();const [terrains,facilities,counts]=await Promise.all(['terrains','facilities','world_facility_counts'].map(n=>BoukenMaster.load(n)));const n=Number(select.value);if(!n)throw Error('サイズを選択してください');const world=BoukenWorldGen.generate(n,n,terrains,facilities,counts);const characters=await BoukenMaster.load('characters');
const owned=characters.filter(c=>Number(current.characters?.[c.id]||0)>0).map(c=>c.id);
const party=BoukenParty.normalize(current.party,owned,BoukenParty.capacity(owned.length));
world.partySnapshot=[...party];
world.partyBuffsSnapshot=BoukenParty.buffs(party,new Map(characters.map(c=>[c.id,c])));const initialOpened=BoukenBuffs.initial(world);BoukenBuffs.initialVision(world);BoukenBuffs.revealNear(world);BoukenBuffs.thresholdVision(world,0,initialOpened);world.b01VisionInitialized=true;world.lastExploredIndex=world.startIndex;current.records=current.records||{};current.records.totalExplored=(current.records.totalExplored||0)+initialOpened;current.world=world;current.worldsStarted=(current.worldsStarted||0)+1;BoukenSave.save(current);location.href='world.html';}catch(e){status.textContent=e.message;status.className='error';button.disabled=false;}});}catch(e){status.textContent=e.message;status.className='error';button.disabled=true;}})();
</script></body></html>
