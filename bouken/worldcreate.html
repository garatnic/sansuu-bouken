<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>冒険ワールドに出発 | 算数ぼうけん</title><style>body{font-family:system-ui,sans-serif;background:#f5f8f4;color:#1e3327;margin:0;padding:14px;max-width:850px;margin-inline:auto}h1{font-size:1.5rem}button,.button{display:block;box-sizing:border-box;width:100%;padding:14px;margin:12px 0;border:0;border-radius:12px;background:#25704d;color:white;font-size:1rem;text-align:center;text-decoration:none;cursor:pointer}.muted{color:#53675b}.panel{background:white;border-radius:14px;padding:15px;margin:12px 0}.error{color:#a11}.map{display:grid;gap:1px;width:max-content;background:#344b45;padding:2px}.cell{width:25px;height:25px;display:grid;place-items:center;font-size:16px;box-sizing:border-box;position:relative}.cell.start{outline:2px solid #fce15c;outline-offset:-2px}.scroll{overflow:auto;max-width:100%;border-radius:8px}.legend{font-size:.9rem;line-height:1.9}</style><style>.page-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}.page-heading h1{margin:0;min-width:0}.page-back{display:inline-block;flex:none;width:auto!important;margin:0!important;padding:9px 11px!important;font-size:.82rem!important;border-radius:9px!important;background:#25704d;color:#fff;text-decoration:none;white-space:nowrap}</style><link rel="stylesheet" href="common/screen-ui.css?v=95"><link rel="stylesheet" href="common/world-select.css?v=95"><link rel="stylesheet" href="common/tutorial.css?v=95"></head><body><section class="world-select-hero" aria-label="冒険の地図"><img width="412" height="308" src="assets/sheets/worldselect.jpg" alt="机いっぱいに広がる、次の冒険へ向かう地図"><header class="page-heading"><h1>冒険ワールドに出発</h1><a class="page-back" href="home.html">ホームに戻る</a></header></section>
<main class="departure-controls"><div class="new-departure"><fieldset id="size" class="world-size-picker" disabled><legend>新しいワールドへ出発！</legend><div class="size-options"></div></fieldset></div><button id="resumeWorld" type="button" aria-describedby="previousGuide" disabled>前のワールドに出発</button><p id="previousGuide" class="sr-only">セーブデータを確認しています…</p><p id="guide" class="departure-guide" hidden>ワールドを生成します。</p><p id="status" role="status">出発の準備をしています…</p><p id="resumeStatus" class="error" role="status"></p><dialog id="replaceWorldDialog" class="replace-world-dialog" aria-labelledby="replaceWorldTitle"><h2 id="replaceWorldTitle">新しいワールドへ出発する？</h2><p>ぼうけんの途中のワールドがあるよ。<br>新しいワールドにすると、今のワールドのつづきは遊べなくなるよ。<br>仲間・コレクション・記録は残るよ。</p><div class="replace-world-actions"><button type="button" id="replaceWorldNo">いいえ</button><button type="button" id="replaceWorldYes">はい</button></div></dialog></main><script src="common/schema.js?v=95"></script><script src="common/achievements.js?v=95"></script><script src="common/save.js?v=95"></script><script src="common/tutorial.js?v=95"></script><script src="common/result.js?v=95"></script><script src="common/progress.js?v=95"></script><script src="common/master.js?v=95"></script><script src="common/worldgen.js?v=95"></script><script src="common/party.js?v=95"></script><script src="common/explore.js?v=95"></script><script src="common/collection.js?v=95"></script><script src="common/buffs.js?v=95"></script><script src="common/world-size-picker.js?v=95"></script><script>
(async()=>{const status=document.getElementById('status'),select=BoukenWorldSizePicker.create(document.getElementById('size'),{onChoose:()=>depart()});let previewActive=true,departing=false,depart=null;
window.addEventListener('pagehide',()=>{previewActive=false;select.destroy();});
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});
try{await BoukenAchievements.init();const save=BoukenSave.load();const resume=document.getElementById('resumeWorld'),previousGuide=document.getElementById('previousGuide');
if(save.world){previousGuide.textContent=save.world.width+'×'+save.world.height+'のワールドを再開できます。';resume.disabled=false;}else{previousGuide.textContent='まだ前のワールドがありません。新しいワールドへ出発しよう！';}
function confirmReplacement(){return new Promise(resolve=>{
 const dialog=document.getElementById('replaceWorldDialog'),yes=document.getElementById('replaceWorldYes'),no=document.getElementById('replaceWorldNo');
 function finish(ok){yes.onclick=no.onclick=null;dialog.oncancel=null;dialog.close();resolve(ok);}
 yes.onclick=()=>finish(true);no.onclick=()=>finish(false);dialog.oncancel=e=>{e.preventDefault();finish(false);};dialog.showModal();no.focus?.();
});}
resume.onclick=()=>{resume.disabled=true;try{const current=BoukenSave.load();if(!current.world)throw Error('再開するワールドがありません');BoukenAchievements.event(current,'resumed');BoukenSave.save(current);location.href='world.html';}catch(err){document.getElementById('resumeStatus').textContent='再開できませんでした：'+err.message;resume.disabled=false;}};
if(BoukenProgress.tutorialLocked(save)){select.configure([{width:Number(save.world.width||5),height:Number(save.world.height||5)}],{fixed:true,locked:true});document.getElementById('guide').hidden=false;document.getElementById('guide').textContent='チュートリアルのすべてのマスを開拓してから、次の世界へ進もう。「前のワールドに出発」でつづきを遊べます。';status.textContent='';return;}const first=(save.worldsStarted||0)<2;const counts=await BoukenMaster.load('world_facility_counts');select.configure(counts.filter(c=>first?c.width===5:c.width!==5),{fixed:first});if(first)document.getElementById('guide').textContent='チュートリアル '+((save.worldsStarted||0)+1)+'：5×5の世界です。';depart=async function(){if(departing||select.disabled)return;departing=true;resume.disabled=true;select.disabled=true;status.textContent='';try{const current=BoukenSave.load();if(BoukenProgress.tutorialLocked(current))throw Error('チュートリアルのつづきを開いてね。');if(current.world&&!BoukenProgress.status(current.world).complete&&!await confirmReplacement())return;if(!await BoukenTutorial.confirmDeparture(current))return;const [terrains,facilities,counts]=await Promise.all(['terrains','facilities','world_facility_counts'].map(n=>BoukenMaster.load(n)));const n=Number(select.value);if(!n)throw Error('サイズを選択してください');const characters=await BoukenMaster.load('characters');
const owned=characters.filter(c=>Number(current.characters?.[c.id]||0)>0).map(c=>c.id);
const departureNumber=(current.worldsStarted||0)+1;const party=departureNumber===1?[]:BoukenParty.normalize(current.party,owned,BoukenParty.capacity(owned.length,current));
const partyBuffs=BoukenParty.buffs(party,new Map(characters.map(c=>[c.id,c])));
BoukenCollection.configure(await BoukenMaster.load('collection_items'),await BoukenMaster.load('collection_rewards'));
const world=BoukenWorldGen.generate(n,n,terrains,facilities,counts,partyBuffs);
world.departureNumber=departureNumber;world.partySnapshot=[...party];BoukenSchema.robotWorld(current,world);
world.partyBuffsSnapshot=partyBuffs;if(window.BoukenResult)BoukenResult.start(world);const initialBase=BoukenBuffs.initial(world);const cumulativeBefore=current.records?.totalExplored||0;const initialA03=BoukenBuffs.threshold(world,world.lastInitialOpenedIndex??world.startIndex,cumulativeBefore,cumulativeBefore+initialBase);const afterA11=cumulativeBefore+initialBase+initialA03.opened;const museumOpened=BoukenCollection.initial(world,BoukenCollection.stages(current)[1]);const museumA03=museumOpened?BoukenBuffs.threshold(world,world.lastInitialOpenedIndex??world.startIndex,afterA11,afterA11+museumOpened):{opened:0,indices:[]};const initialOpened=initialBase+initialA03.opened+museumOpened+museumA03.opened;BoukenBuffs.initialVision(world);BoukenBuffs.revealNear(world);BoukenBuffs.thresholdVision(world,0,initialOpened);world.b01VisionInitialized=true;world.lastExploredIndex=museumA03.indices.at(-1)??(museumOpened?world.lastInitialOpenedIndex:initialA03.indices.at(-1))??world.lastInitialOpenedIndex??world.startIndex;current.records=current.records||{};current.records.totalExplored=(current.records.totalExplored||0)+initialOpened;if(world.adventureStats)world.adventureStats.automaticOpened=initialOpened;BoukenAchievements.departure(current,world,initialOpened);current.world=world;current.worldsStarted=departureNumber;BoukenProgress.recordMilestones(current,world,undefined,characters);if(window.BoukenResult)BoukenResult.finish(current,world);BoukenSave.save(current);location.href='world.html';}catch(e){status.textContent=e.message;status.className='error';select.disabled=false;resume.disabled=!save.world;}finally{if(location.href.indexOf('world.html')<0){select.disabled=false;resume.disabled=!save.world;}departing=false;}};select.disabled=false;status.textContent='';
function refreshPreviews(){void(async()=>{try{
 const [terrains,facilities,characters]=await Promise.all(['terrains','facilities','characters'].map(n=>BoukenMaster.load(n)));
 if(!previewActive)return;
 const previewSave=BoukenSave.load();
 const owned=characters.filter(c=>Number(previewSave.characters?.[c.id]||0)>0).map(c=>c.id);
 const party=BoukenParty.normalize(previewSave.party,owned,BoukenParty.capacity(owned.length,previewSave));
 const buffs=BoukenParty.buffs(party,new Map(characters.map(c=>[c.id,c])));
 await select.preview({terrains,facilities,counts,buffs});
}catch{if(previewActive)select.previewFailed();}})();}
if(!first)refreshPreviews();
}catch(e){status.textContent=e.message;status.className='error';select.disabled=true;}})();
</script></body></html>
